    ['الصحيح: يجمع معلومات المهام والمتطلبات التي يبنى عليها الوصف والمواصفات.', 'تحليل داخلي استراتيجي للموارد والقدرات؛ ليس الاسم الأدق لهذه العملية الوظيفية المحددة.', 'يراجع البيئة والفرص والتهديدات خارج المنظمة، لا مهام الوظيفة.', 'يرتب المهام أو يغيرها؛ النص يركز على دراستها وجمع المعلومات عنها.'],
    ['حدد موضوع المعلومات: وظيفة ومهام وKSA.', 'ميز العملية Job analysis عن ناتجيها description وspecification.', 'تأكد أن النص يصف جمع المعلومات، لا إعادة ترتيب العمل.']);
  L(4, ['needs'], 'عند تقييم الاحتياجات التدريبية، أي تحليل يجري عادة أولًا؟',
    'السؤال لا يطلب اسم مرحلة التدريب كلها؛ بل أول تحليل داخل تقييم الاحتياجات. نبدأ بمنظور المنظمة لنقرر ملاءمة التدريب للاستراتيجية والموارد والدعم، ثم نحدد الأفراد والمحتوى. لذلك نختار Organizational analysis. ترتيب تحليلي الفرد والمهمة قد يتداخل عمليًا، لكن البداية التنظيمية هي المقصودة هنا.',
    ['يوضح المهام والمهارات المراد تعلمها، لكنه ليس البداية المعتادة المطلوبة هنا.', 'الصحيح: نتحقق أولًا من ملاءمة التدريب للمنظمة ودعمها له.', 'يوضح من يحتاج التدريب وأسباب فجوة أدائه، بعد النظر للسياق التنظيمي.', 'ليس أحد التحليلات الثلاثة الأساسية لتقييم الاحتياج التدريبي في هذا النموذج.'],
    ['حدد العملية: Needs assessment وليست HR planning.', 'لاحظ كلمة first؛ المطلوب أول تحليل داخل المرحلة.', 'ابدأ بسؤال لماذا التدريب مناسب للأعمال؟ فتصل إلى Organizational analysis.']);
  L(5, ['workflow'], 'ما آخر ما نحدده في تحليل تدفق العمل لإنتاج منتج الوحدة؟',
    'نبدأ التحليل من المخرج المطلوب، ثم نحدد العمليات التي تنتجه، ثم الموارد اللازمة لهذه العمليات. آخر عنصر نصل إليه في الدراسة هو Inputs. لو كان السؤال عن التشغيل الفعلي لبدأنا بالمدخلات وانتهينا بالمخرجات؛ تغيير نوع العملية يغير اتجاه الترتيب.',
    ['المخرجات تحدد أولًا في التحليل لأنها الهدف الذي نرجع منه إلى المتطلبات.', 'العمليات تقع بعد تحديد المخرجات وقبل الموارد المطلوبة.', 'العلاقات ليست العنصر الأخير في ترتيب Outputs ثم Processes ثم Inputs.', 'الصحيح: المدخلات تحدد أخيرًا بعد معرفة الناتج وخطوات إنتاجه.'],
    ['ضع دائرة على work-flow analysis وfinal stage.', 'رتب الدراسة: المخرجات المطلوبة ثم عملياتها ثم مواردها.', 'اختر Inputs، وتجنب استخدام ترتيب الإنتاج بدل التحليل.']);
  L(6, ['interviews'], 'أي سؤال مقابلة يطلب مثالًا من خبرة حدثت فعلًا في الماضي؟',
    'مثال إسماعيل يطلب describe an event where his creativity led to حل ناجح؛ فهو يروي حادثة حدثت ونتيجتها. بقية الأمثلة تستخدم would أو if وتسأل عن تصرف افتراضي. الفرق هو واقع الموقف وزمنه، وليس هل المشكلة تقنية أم اجتماعية.',
    ['how he would resolve يسأل عما سيفعله في موقف افتراضي، لا تجربة فعلية.', 'reaction if يسأل عن موقف مفترض حتى لو كان موضوعه سلوكًا غير مقبول.', 'الصحيح: يصف حدثًا وقع فعلًا واستخدم فيه إبداعه لحل مشكلة.', 'what steps she would take يسأل عن استجابة مستقبلية افتراضية.'],
    ['اقرأ هل يطلب المقابل قصة حقيقية أم تصورًا لما قد يحدث.', 'استخرج القرينة الماضية: describe an event ... led to.', 'اختر مثال إسماعيل؛ لا تختَر بناءً على موضوع المشكلة وحده.']);
  L(7, ['structure', 'workflow'], 'مدير جديد يريد رؤية العلاقات بين الأفراد والوحدات؛ ماذا يدرس؟',
    'الكلمة الحاسمة relationships مرتبطة هنا بـindividuals and units: من يتبع من وكيف تتوزع الإدارات. هذه خريطة تنظيمية، أي Organization structure. لو كان يريد خطوات تحويل طلب إلى خدمة لكان التركيز على تدفق العمل بدل خطوط السلطة والوحدات.',
    ['يدرس المخرجات والعمليات والمدخلات، لا خريطة التبعية بين الأفراد والوحدات.', 'الصحيح: الهيكل التنظيمي يوضح العلاقات الرسمية وخطوط الارتباط.', 'تقييم سير العمل لا يطابق طلب رؤية العلاقات التنظيمية بين الأشخاص والوحدات.', 'يرتب تتابع الأنشطة، بينما النص يركز على الهيكل والعلاقات الرسمية.'],
    ['حدد أطراف العلاقات: أشخاص ووحدات، لا مراحل إنتاج.', 'اربط من يتبع من بالهيكل التنظيمي.', 'قارنها بتدفق العمل: مدخلات وأنشطة ومخرجات.']);
  L(8, ['jobDesign'], 'ما هدف المنهج البيولوجي في تصميم الوظيفة؟',
    'المنهج Biological يعدل تصميم العمل والبيئة حتى تقل متطلباته الجسدية على الإنسان. لذلك الجواب الذي يجمع reduce physical demands مع improving physical work environment هو المطابق. لا ينقل العبء إلى الموظف ليصبح أقوى بدنيًا، بل يعيد ملاءمة العمل له.',
    ['تبسيط العمل لتسريع التدريب أقرب إلى Mechanistic.', 'الصحيح: تقليل المتطلبات البدنية بتحسين بيئة العمل.', 'تقوية جسم الموظف ليست الهدف الأساسي لتصميم العمل البيولوجي.', 'قصر الوظائف على متخصصين لا يعرّف ملاءمة العمل للجسم.'],
    ['اربط Biological بالجسم والإجهاد البدني.', 'ابحث عن تغيير في العمل أو البيئة يناسب الإنسان.', 'اختر تقليل المتطلبات البدنية، لا مجرد زيادة قوة الإنسان.']);
  L(9, ['forecasting', 'transition'], 'ما أول خطوة في تخطيط الموارد البشرية؟',
    'قبل تحديد أهداف التوظيف أو التدريب نحتاج صورة متوقعة للطلب والعرض. التنبؤ Forecasting يكشف حجم النقص أو الفائض، وبعده نضع هدفًا وخطة ثم ننفذ ونقيّم. المصفوفة الانتقالية مثال أداة لتقدير العرض الداخلي ضمن هذه المرحلة، وليست بديلًا عن اسمها.',
    ['الصحيح: نقدر الطلب والعرض قبل تحديد الاستجابة.', 'تحديد الأهداف يأتي بعد أن يكشف التنبؤ الفجوة.', 'التنفيذ يأتي بعد وضع الهدف والخطة، وليس البداية.', 'التقييم يراجع نتائج البرنامج بعد تنفيذه.'],
    ['حدد أن العملية هي Human resource planning.', 'اسأل ماذا نحتاج قبل اختيار خطة؟ تقدير المستقبل.', 'رتب: Forecasting ثم هدف وخطة ثم تنفيذ ثم تقييم.']);
  L(10, ['onet', 'jobAnalysis'], 'أي عبارة صحيحة عن قاعدة O*NET للمعلومات المهنية؟',
    'تقدم O*NET أوصافًا مهنية بلغة مشتركة تساعد على فهم متطلبات العامل والعمل والمقارنة بينها. لذلك نختار العبارة التي تذكر common language وjob specifications. ليست مجرد قائمة خاصة بالوظائف الشاغرة، ولا تعتمد حصريًا على مسميات ثابتة أو أوصاف ضيقة.',
    ['ليست مجرد فهرس خاص لإعلانات الوظائف الشاغرة؛ هي قاعدة معلومات مهنية عامة.', 'الصحيح: تستخدم لغة مشتركة لوصف متطلبات المهن والمقارنة بينها.', 'exclusively on fixed job titles يحذف أبعاد المعلومات الأخرى التي تقدمها.', 'exclusively on narrow task descriptions أضيق من وصف المهارات والقدرات والأنشطة والسياق.'],
    ['حدد وظيفة المصدر: وصف المهن ومتطلباتها.', 'ابحث عن common language لا مجرد job listings.', 'راجع كلمات الحصر exclusively؛ البدائل المحصورة لا تصف نطاقه.']);
  L(11, ['behavioral', 'performanceCriteria'], 'ما العبارة الصحيحة عن الأساليب السلوكية لقياس الأداء؟',
    'تترجم الأساليب السلوكية ما تحتاجه الاستراتيجية إلى تصرفات محددة يمكن ملاحظتها وتقديم ملاحظات عنها. مثلًا التميز بالخدمة يحتاج سلوك الإصغاء والمتابعة. هذا لا يجعل كل أداة سلوكية مثالية، لكنه يفسر لماذا الخيار الذي يربط strategy بـspecific behavior هو الأنسب.',
    ['الصحيح: يربط الاستراتيجية بسلوك محدد يساعد تنفيذها.', 'المعايير السلوكية المحددة تهدف لتقليل الأحكام العامة؛ لا توصف كلها بأنها شديدة الذاتية.', 'ضعف الصدق والقبول ليس قاعدة تعريفية عامة للأساليب السلوكية.', 'هذه صياغة غير مناسبة لافتراضها الدراسي؛ التركيز على سلوك محدد يدعم الأداء، لا افتراض تعدد طرق مثلى.'],
    ['حدد المستوى المقاس: فعل يلاحظه المقيم، لا صفة عامة فقط.', 'اربط الفعل بهدف المنظمة.', 'اختر العبارة التي تذكر ترجمة الاستراتيجية إلى سلوك محدد.']);
  L(12, ['measurement', 'reliabilityTypes'], 'ما المصطلح الذي يعني خلو المقياس من الخطأ العشوائي؟',
    'random error يعني تقلبًا لا يعكس اختلافًا حقيقيًا فيما نقيسه. عندما يقل هذا الخطأ تكون النتيجة أكثر اتساقًا، أي Reliability. الثبات يختلف عن Validity: قد تتكرر نتيجة غير مناسبة للغرض، فتكون متسقة دون أن تكون صادقة للاستخدام المطلوب.',
    ['الصحيح: الثبات هو الاتساق وقلة الخطأ العشوائي.', 'الصدق يتعلق بما إذا كانت الأداة تقيس ما يقصد قياسه وتدعم تفسيرها.', 'قابلية التعميم تتعلق بامتداد الدليل عبر سياقات، لا تعريف الخطأ العشوائي.', 'المنفعة تقارن القيمة العملية بالتكلفة.'],
    ['استخرج القرينة random error.', 'اسأل عن الاتساق لا عن الشيء المقاس أو العائد المالي.', 'اختر Reliability، ثم ميز نوعه إذا ورد زمن أو مقيمون في سؤال آخر.']);
  L(13, ['emotional'], 'أي جانب من الذكاء العاطفي يعني معرفة الشخص نقاط قوته وضعفه؟',
    'المعرفة المذكورة تخص الشخص نفسه: ما يجيده وما يحتاج تحسينه. هذه Self-awareness حتى لو لم يبدأ بعد في تدريب نفسه أو ضبط رد فعله. لو وصف فهم شعور الآخرين لاختَرنا التعاطف، ولو وصف المثابرة لاختَرنا الدافع الذاتي.',
    ['يدل على تحفيز النفس والمثابرة نحو الهدف، لا مجرد معرفة قوتها وضعفها.', 'يركز على فهم مشاعر الآخرين ووجهة نظرهم.', 'يركز على إدارة العلاقات والتواصل والتعاون.', 'الصحيح: الوعي بالذات يشمل معرفة القوة والضعف والمشاعر.'],
    ['حدد من موضوع المعرفة: أنا نفسي.', 'ميز بين إدراك نفسي وبين تحفيزها أو فهم الآخرين.', 'اختر Self-awareness لأن النص يصف معرفة داخلية.']);
  L(14, ['appraisal'], 'تقييم المدير يجمع آراء من فوقه ومن مستواه ومن تحته؛ ما اسم التقنية؟',
    'النص يصف جهات تقييم تحيط بالمدير: أعلى وزملاء ومرؤوسون. الاسم المحدد لهذا التقييم المتعدد هو 360-degree appraisal. Performance appraisal اسم عام صحيح للفئة لكنه أقل تحديدًا، وUpward feedback يصف اتجاهًا واحدًا فقط من الأسفل.',
    ['يتحقق من معلومات مرشح أثناء الاختيار، لا تقييم مدير من جهات عمل متعددة.', 'الصحيح: يجمع التقييم من مستويات العلاقة المختلفة حول المدير.', 'يشمل رأي المرؤوسين فقط؛ لا يغطي فوقه ومستواه أيضًا.', 'اسم عام لتقييم الأداء، بينما المطلوب التقنية المحددة متعددة الجهات.'],
    ['عد جهات المعلومات، لا عدد الأشخاص.', 'وجود above وequal وbelow يحدد تقييمًا من جهات متعددة.', 'اختر 360-degree appraisal بدل المصطلح العام أو الاتجاه الواحد.']);
  L(15, ['lean'], 'عندما تراجع الشركة عملياتها بمنهج Lean، ما الذي تحاول تحقيقه؟',
    'الهدف تقديم قيمة أكثر بموارد أقل عبر إزالة الهدر وتحسين انسياب العمل. الخيار الذي يجمع effort وtime وspace وequipment أقل هو المطابق. التقليل المقصود في الموارد المهدرة، مع المحافظة على القيمة والجودة التي يحتاجها العميل.',
    ['يركز على عمل قليل ودقة، لكنه لا يعبّر عن خلق قيمة أكبر وإزالة الهدر.', 'لا يشترط Lean التضحية بالحجم لتقديم الخدمة؛ المقصود تحسين القيمة والكفاءة.', 'maximum resources يعاكس تقليل الهدر واستخدام الموارد بكفاءة.', 'الصحيح: إنجاز قيمة أكثر بجهد ووقت ومساحة ومعدات أقل.'],
    ['حدد ما الذي نزيله: الهدر، لا القيمة المطلوبة.', 'ابحث عن قيمة أو إنجاز أكثر مع موارد أقل.', 'استبعد maximum resources وأي تصور يخفض الجودة لمجرد تقليل العمل.']);
  L(16, ['onboarding'], 'ما الجانب الأخير في نموذج التهيئة الوظيفية الذي يقصده السؤال؟',
    'النموذج يضم Compliance ثم Clarification ثم Culture ثم Connection. الأخير يركز على بناء علاقات ومصادر دعم، وليس مجرد إعطاء سياسات أو توضيح واجبات. هذه جوانب تهيئة قد تتداخل عمليًا، لكن السؤال يختبر ترتيب 4Cs الوارد في المادة.',
    ['توضيح الدور والتوقعات؛ ليس الجانب الأخير في ترتيب النموذج.', 'القواعد والسياسات الأساسية، ويأتي في بداية النموذج.', 'ليست واحدة من جوانب 4Cs المقصودة: Compliance وClarification وCulture وConnection.', 'الصحيح: بناء الصلات والعلاقات هو الجانب الأخير في هذا الترتيب.'],
    ['حدد النموذج: جوانب التهيئة 4Cs.', 'استرجع معانيها: قواعد، دور، ثقافة، علاقات.', 'اختر Connection عندما يطلب الجانب الأخير.']);

  L(17, ['outsourcing'], 'أي عبارة تصف التعهيد بصورة صحيحة؟',
    'الشركة التي لا تملك الخبرة ولا تريد تطويرها داخليًا قد تستفيد من مقدم خدمة متخصص. هذا تفسير منطقي لاختيار Outsourcing. لا يعني أن كل نشاط ينبغي إسناده للخارج؛ نقارن أهمية الخبرة والتكلفة والجودة والقدرة على إدارة المورد. وكون المورد خارج البلد مسألة أخرى تسمى Offshoring.',
    ['لم يبدأ التعهيد لمجرد تقادم أساليب الإنتاج؛ ليست قاعدة تصف صحته.', 'الصحيح: الاستعانة بمتخصص منطقية حين لا تتوفر الخبرة ولا يراد بناؤها داخليًا.', 'التقنية قد تسهل التنسيق مع المورد؛ لا توجد قاعدة أنها أبطأت التعهيد.', 'التنبؤ الإحصائي ليس السبب المحدد أو الوحيد لإسناد العمل إلى الخارج.'],
    ['حدد معنى التعهيد: تنفيذ نشاط عند مقدم خارجي.', 'ابحث عن مبرر بناء الخبرة داخليًا أو شرائها.', 'اختر نقص الخبرة وعدم الرغبة في تطويرها، وميز الملكية عن بلد التنفيذ.']);
  L(18, ['training'], 'ما اسم استخدام المعارف والمهارات والسلوكيات المتعلمة في أداء الوظيفة؟',
    'الكلمتان معًا هما learned in training وon-the-job use؛ أي أن التعلم حصل ثم استُخدم في العمل الحقيقي. هذا هو Transfer of training. مجرد فهم المعلومة أو تجربة تمرين أثناء الدورة لا يكفي لإثبات هذا النقل، لأن المقصود استخدام نتائج التعلم في الوظيفة.',
    ['استيعاب المعلومات قد يحدث داخل الدورة؛ النص يضيف استخدامها في الوظيفة.', 'الصحيح: تطبيق ما تعلمه الموظف في عمله هو نقل أثر التدريب.', 'ليس المصطلح المعتمد لهذا التعريف في النموذج؛ الفكرة ليست تبنيًا ذهنيًا فقط.', 'الممارسة طريقة تعلم، بينما السؤال يركز على استعمال ما تعلم في الوظيفة.'],
    ['لاحظ أنه لا يصف حضور دورة أو حفظ معلومة.', 'اربط التعلم السابق بالاستخدام الفعلي في الوظيفة.', 'اختر Transfer of training، ثم اسأل هل توجد فرصة ودعم لاستمرار التطبيق.']);
  L(19, ['transition', 'forecasting'], 'ما الأداة التي تعرض نسب الموظفين في فئات وظيفية مختلفة عبر أوقات مختلفة؟',
    'نحتاج أداة تربط فئة الموظف في فترة بفئته لاحقًا: بقاء أو ترقية أو نقل أو خروج. المصفوفة الانتقالية Transitional matrix تنظم هذه النسب وتفيد في توقع العرض الداخلي. ليست مجرد عدد موظفي اليوم أو مصفوفة أدوار المهام.',
    ['مصطلح رياضي عن قابلية عكس مصفوفة، لا اسم أداة حركة الموظفين هنا.', 'الصحيح: تربط نسب الانتقال بين الفئات عبر الزمن.', 'لا يعرّف أداة تتبع حركة الفئات الوظيفية في التخطيط.', 'يربط المهام والأدوار، ولا يصف نسب الانتقال عبر الفترات.'],
    ['استخرج القرائن: proportion وjob categories وdifferent times.', 'تخيل صفًا لفئة حالية وأعمدة للفئات المستقبلية والخروج.', 'اختر Transitional matrix لأنها تتبع الحركة وتساعد توقع العرض.']);
  L(20, ['abilities'], 'ما القدرة المتعلقة بسرعة ودقة حل المسائل الحسابية؟',
    'طبيعة المهمة هي arithmetic problems، أي مسائل أرقام وحساب، لذلك Quantitative هي الفئة المباشرة. كلمة السرعة وحدها ليست كافية؛ فقد توجد سرعة فهم أو إدراك. نربط القدرة بنوع العمل المطلوب، وهو الحساب هنا.',
    ['الاستدلال أوسع؛ السؤال يحدد مجالًا حسابيًا مباشرًا.', 'المهارة الفنية تتعلق بأداة أو تخصص؛ لا توجد هنا قرينة تخصص محدد.', 'الصحيح: القدرة الكمية تتعلق بمعالجة الأرقام والحساب.', 'الفهم يستوعب معنى المعلومات، وليس اسم الفئة الحسابية المقصودة.'],
    ['حدد نوع المشكلة، لا وصف السرعة فقط.', 'اربط arithmetic بالأرقام والحساب.', 'اختر Quantitative وفرقها عن الفهم والاستدلال العام.']);
  L(21, ['expat'], 'سعد انتقل من السعودية للعمل في نيوهامبشر وليس مواطنًا دائمًا هناك؛ ما وصفه الوظيفي الأنسب؟',
    'المعلومة المؤكدة أنه سعودي أُرسل للعمل خارج بلده، وهذا يكفي لاختيار Expatriate. لا يذكر النص أنه يعود لبلده أو أنه مواطن بلد الاستضافة أو أنه جاء من فرع أجنبي إلى مقر الشركة. لذلك لا نضيف معلومة عن المقر حتى نسميه Inpatriate. التصنيف هنا تكليف عمل دولي، وليس حكمًا على وضعه القانوني التفصيلي.',
    ['لا توجد قرينة أنه مواطن بلد الاستضافة؛ النص يصف انتقاله من السعودية.', 'يعني عائدًا إلى بلده بعد مهمة خارجية؛ لا يصف اتجاه السفر المذكور.', 'الصحيح: أُرسل للعمل خارج بلده.', 'يتطلب تحديد انتقال من فرع خارجي إلى المقر؛ وهذه المعلومة غير موجودة.'],
    ['ارسم الاتجاه المذكور فقط: السعودية إلى بلد آخر للعمل.', 'استبعد العودة والمواطنة المحلية لغياب قرينتهما.', 'اختر Expatriate دون افتراض أن وجهة السفر هي المقر الرئيسي.']);
  L(22, ['jobAnalysis'], 'أي مصطلح يضم المعارف والمهارات والقدرات والخصائص الأخرى المطلوبة لأداء وظيفة؟',
    'المذكور صفات ومتطلبات يجب أن تتوفر في الشخص: KSAOs. هذه Job specification. لو كان النص يسرد أعمال الموظف ومسؤولياته لكان Job description. تحليل الوظيفة هو العملية التي تمد الوثيقتين بالمعلومات، فلا نخلط العملية بالناتج.',
    ['الصحيح: يحدد متطلبات الشخص من معارف ومهارات وقدرات وخصائص.', 'يصف واجبات العمل ومسؤولياته، لا مؤهلات الشخص المطلوبة.', 'الرضا الوظيفي موقف أو شعور تجاه العمل، لا قائمة متطلبات شاغله.', 'يقارن قيمة الوظائف لتحديد موقعها النسبي، لا يعرّف KSAOs.'],
    ['اسأل: هل المعلومات عن العمل أم عن الشخص المطلوب؟', 'KSAOs تحدد ما يجب أن يمتلكه الشخص من معارف ومهارات وقدرات وخصائص أخرى.', 'اختر Job specification واحتفظ بعبارة المهام والمسؤوليات للوصف الوظيفي.']);
  L(23, ['hrFunctions', 'onboarding'], 'أي نشاط يتبع وظيفة التدريب والتطوير في إدارة الموارد البشرية؟',
    'المطلوب تصنيف نشاط ضمن وظيفة محددة. Orientation يعلم الموظف الجديد ما يحتاج معرفته عن المنظمة والعمل، لذا يدخل ضمن التدريب والتطوير. بقية الخيارات أعمال HR أيضًا، لكن تحليل الوظائف وقياس الأداء واستطلاع الاتجاهات لها أغراض مختلفة. كون النشاط ضمن الموارد البشرية لا يكفي؛ نطابق غرضه مع الوظيفة المطلوبة.',
    ['يدرس الوظيفة ومتطلباتها؛ يتبع التحليل والتصميم لا النشاط التدريبي المقصود.', 'الصحيح: البرنامج التعريفي يعلم الموظف الجديد المنظمة والعمل.', 'مقاييس الأداء تستخدم لتقدير الأداء ضمن إدارة الأداء.', 'تقيس اتجاهات الموظفين وتساعد فهم علاقاتهم وتجربتهم؛ ليست برنامج تعريف وتعلم.'],
    ['ابدأ بالوظيفة المطلوبة: training and development.', 'اسأل أي خيار يعلم الموظف أو يجهزه للعمل؟', 'اختر Orientation، ثم صنف البقية حسب أغراضها بدل حفظ اسم واحد فقط.']);
  L(24, ['linkage'], 'ما أدنى مستوى لتكامل الموارد البشرية مع الإدارة الاستراتيجية؟',
    'نرتب المستويات حسب مشاركة HR في القرار: Administrative ثم One-way ثم Two-way ثم Integrative. في الأدنى تظل المهام اليومية والإدارية مركز الدور دون مشاركة استراتيجية مؤثرة. السؤال يطلب lowest، فلا تختَر أعلى تكامل لمجرد أن العبارة تبدو أفضل.',
    ['الصحيح: الموارد البشرية منفصلة نسبيًا عن صياغة الاستراتيجية ومنشغلة بالإدارة.', 'يتضمن تبادلًا ومشاركة قبل القرار ثم تنفيذًا؛ أعلى من الإداري والأحادي.', 'أعلى تكامل مستمر، وهو عكس lowest.', 'تصل الاستراتيجية إلى HR للتنفيذ؛ أعلى ارتباطًا من المستوى الإداري.'],
    ['انتبه إلى lowest قبل مقارنة المصطلحات.', 'رتبها: إداري، أحادي، ثنائي، تكاملي.', 'اختر Administrative linkage واربطه بغياب المشاركة الاستراتيجية المؤثرة.']);
  L(25, ['strategyProcess'], 'هدى تستخدم SWOT مع فريق الاستراتيجية لتحديد رسالة الشركة وأهدافها؛ أي مرحلة تمارس؟',
    'هدى تناقش ما تريد المنظمة أن تكونه وما تريد تحقيقه وتفحص وضعها؛ أي تختار الاتجاه. هذا Strategy formulation. التنفيذ يحتاج اتجاهًا مختارًا ثم يجهز الأفراد والموارد لتطبيقه. لا يكفي وجود كلمة training أو task في بديل ما لأن النص يصف قرارًا على مستوى الاستراتيجية.',
    ['التنفيذ يطبق اتجاهًا اختير؛ النص يصف تحديد الرسالة والأهداف وتحليل البدائل.', 'تصميم المهمة يركز على ترتيب عمل وظيفي محدد، لا رسالة الشركة.', 'الاختيار والتدريب أنشطة تجهز الأفراد، وليسا اسم مرحلة اختيار الاتجاه.', 'الصحيح: صياغة الاستراتيجية تشمل تحديد الرسالة والأهداف وتحليل SWOT.'],
    ['استخرج الأفعال: define mission and goals وSWOT.', 'ميز اختيار الاتجاه عن تطبيق الاتجاه.', 'اختر Strategy formulation لأنهم ما زالوا يحددون الوجهة.']);
  L(26, ['training', 'knowledge'], 'ما الاسم للبرامج والدورات والفعاليات التطويرية التي تطورها الشركة وتنظمها؟',
    'السؤال يصف وجود برنامج مخطط وتنظيم من الشركة، وليس مجرد نوع معرفة أو نتيجة تعلم. هذا Formal training سواء حضوريًا أو عبر الإنترنت. يمكن أن يتضمن البرنامج ممارسة ومعرفة ضمنية، لكن اسمه هنا يحدد طريقة التنظيم.',
    ['نوع معرفة مبني على الخبرة، وليس اسم برنامج تنظمه الشركة.', 'الصحيح: التدريب الرسمي برامج ودورات مخططة ومنظمة.', 'يصف تطبيق نتائج التدريب في الوظيفة، لا تنظيم الدورة نفسها.', 'التعلم الضمني ليس الوصف المباشر لبرامج ودورات رسمية مخططة.'],
    ['لاحظ programs وcourses وorganized by the company.', 'صنف المطلوب: تنظيم تدريب، لا نوع معرفة ولا تطبيق لاحق.', 'اختر Formal training، ثم ميزه عن التعلم غير الرسمي ونقل الأثر.']);
  L(27, ['performanceCycle', 'hrFunctions'], 'سارة تقدم توجيهًا لوحدة عمل أداؤها ضعيف؛ تحت أي وظيفة يقع هذا النشاط؟',
    'الوحدة تعمل بالفعل لكنها أقل من المستوى المطلوب؛ وCoaching يساعدها على تحسين الأداء. لذلك النشاط جزء من Performance management التي تشمل المتابعة والتوجيه والتغذية الراجعة، لا التقييم السنوي فقط. وجود تدريب في التوجيه لا يغير الغرض المباشر الموصوف وهو علاج فجوة أداء.',
    ['يجذب المرشحين ويختارهم؛ الفريق هنا موجود بالفعل.', 'يتعلق بالأجور والمزايا، ولم يصف النص تغيير مكافأة.', 'يهتم بعلاقة المنظمة بالموظفين؛ الغرض المباشر هنا تحسين مستوى الأداء.', 'الصحيح: توجيه وحدة ضعيفة الأداء نشاط تحسين ضمن إدارة الأداء.'],
    ['حدد حالة الأشخاص: فريق قائم، وليس مرشحين للتوظيف.', 'حدد غرض تدخل سارة: تحسين الأداء الضعيف.', 'اربط coaching وunderperforming بإدارة الأداء.']);
  L(28, ['feedback', 'performanceCycle'], 'ناقش كيف يستطيع المدير تحسين عملية التغذية الراجعة عن الأداء.',
    'السؤال مقالي ويطلب طرقًا قابلة للتفسير، لا تعريف Feedback وحده. ابنِ الإجابة من خمسة محاور: التوقيت والخصوصية، دليل سلوكي محدد، حوار عن الأسباب، تعزيز ما نجح، ثم هدف وخطة ومتابعة. اشرح كيف يحوّل كل محور الملاحظة إلى تحسين، واختم بمثال بدل حكم على شخصية الموظف.', [],
    ['ابدأ بجملة أن التغذية الراجعة تكون دورية وفي وقت ومكان مناسبين.', 'اذكر أمثلة محددة على السلوك والنتيجة واستمع إلى تفسير الموظف.', 'بين ما يجب الاستمرار فيه وما يجب تحسينه، واتفق على هدف ودعم وموعد متابعة.', 'استخدم مثال التقرير المتأخر لتوضح الفرق بين أنت مهمل وملاحظة قابلة للعمل.']);
  L(29, ['hrFunctions'], 'اذكر ستة مجالات وظيفية مهمة للموارد البشرية ثم اشرح واحدًا منها بالتفصيل.',
    'للسؤال جزآن يجب تغطيتهما: سرد ست مجموعات ثم توسيع واحدة. الجدول يقدم تجميعًا دراسيًا مقترحًا لأن قوائم المصادر المرفقة ليست موحدة. لشرح الاستقطاب والاختيار مثلًا: الأول يجذب مرشحين مناسبين، والثاني يقارنهم بمتطلبات العمل عبر وسائل مناسبة ليختار الأنسب، مع مثال إعلان ثم مقابلات وقرار قبول. طابق تسمية المجالات مع محاضرتك إذا كانت قائمة محددة.', [],
    ['اذكر المجالات الستة في الجدول مع الانتباه إلى أنها إجابة مجمعة مقترحة.', 'اختر مجالًا واحدًا مثل Recruitment and selection، وعرّف جزأيه.', 'اشرح غرضه وطريقة عمله ثم أعط مثال إعلان الوظيفة والمقابلات.', 'تأكد أنك أجبت عن explain one ولم تكتف بكتابة الأسماء الستة.']);
  L(30, ['interviews'], 'اشرح المقابلات الموقفية ونوعي أسئلة المواقف المرتبطين بهذا السياق الدراسي.',
    'ابدأ بأنها تقيم طريقة تعامل المتقدم مع مواقف ذات صلة بالعمل. ثم فرق بين Experience-based الذي يطلب حادثة فعلية سابقة، وFuture-oriented الذي يطلب استجابة لموقف افتراضي. أعط مثالًا لكل منهما. هذا تقسيم أسئلة المقابلات المقصود بالسياق؛ أما Knowledge وBehavioral tendency فهو تقسيم آخر لتعليمات الاستجابة في اختبارات الحكم الموقفي ولا يحل محله تلقائيًا.', [],
    ['عرّف المقابلة بأنها تقييم لاستجابة المرشح لموقف عمل.', 'اشرح الماضي الفعلي: ماذا فعلت؟ مع مثال نزاع سبق حله.', 'اشرح المستقبل الافتراضي: ماذا ستفعل لو؟ مع مثال شكوى محتملة.', 'اذكر الفرق في طبيعة الموقف دون الخلط بينه وبين كون المقابلة منظمة أو تعليمات اختبارات SJT.']);
  L(31, ['interviews', 'abilities'], 'حوار يبدأه شخص أو أكثر لجمع معلومات وتقييم مؤهلات متقدم لوظيفة؛ ما اسمه؟',
    'التعريف يجمع dialogue وqualifications of an applicant for employment؛ أي حوار هدفه اختيار شخص للعمل. هذا Selection interview. اختبار القدرة يقيس أداء مهمة أو قدرة محددة، ومجموعة النقاش تجمع آراء حول موضوع؛ لا يطابق أي منهما تعريف المقابلة الوظيفية هنا.',
    ['الصحيح: مقابلة اختيار لجمع المعلومات وتقييم المرشح للوظيفة.', 'مجموعة نقاش تركز عادة على آراء مشاركين في موضوع، لا هذا التعريف الفردي للاختيار.', 'يقيس قدرة بدنية عبر مهمة أو أداء، وليس حوار تقييم مؤهلات.', 'يقيس قدرة معرفية؛ النص يصف حوارًا بين المقابل والمتقدم.'],
    ['حدد طريقة جمع البيانات: dialogue أي حوار.', 'حدد الهدف: تقييم مؤهلات applicant for employment.', 'اجمع القرينتين فتصل إلى Selection interview.']);
  L(32, ['surplus'], 'ناقش الخيارات الأساسية التي تستخدمها المنظمات لخفض فائض العمالة.',
    'عرّف الفائض أولًا بأنه عرض عاملين أكبر من حاجة العمل. ثم اعرض بدائل مباشرة مثل تقليص العمالة وخفض الأجور أو الدرجة، وبدائل لإعادة التوزيع مثل النقل وإعادة التدريب ومشاركة العمل، وبدائل تدريجية مثل تجميد التوظيف والتناقص الطبيعي والتقاعد المبكر. ناقش السرعة والأثر على العاملين؛ فخفض التكلفة وحده قد لا يخفض عدد الأشخاص مباشرة.', [],
    ['ابدأ بمقارنة العرض بالطلب: العرض أكبر، إذن فائض.', 'اذكر خيارات متنوعة بدل حصر الإجابة في التسريح.', 'اشرح الفرق بين خفض العدد، خفض الساعات أو التكلفة، وإعادة توزيع القدرة.', 'قارن بديلًا سريعًا شديد الأثر ببديل تدريجي، وأضف مثال 100 موظف مقابل حاجة إلى 90.']);

  L(33, ['dimensions'], 'ما الأبعاد الأربعة التي تجمع ممارسات إدارة الموارد البشرية؟',
    'المطلوب أربع مجموعات كبيرة: إدارة البيئة، اكتساب وتجهيز الأفراد، تقييم وتطوير الأفراد، وتعويضهم. اشرح كل مجموعة بجملة عن غرضها ومثال. هذا مستوى تجميع أوسع من سؤال المجالات الوظيفية الستة؛ اختلاف الرقم يعكس اختلاف طريقة التصنيف، فلا تستبدل قائمة الستة بقائمة الأربعة.', [],
    ['اكتب أسماء الأبعاد الأربعة بالترتيب الذي تحفظه من الجدول.', 'أضف معنى مختصرًا: سياق العمل، توفير الأفراد، تحسينهم، ثم مكافأتهم.', 'اربطها بمثال فرع جديد: دراسة البيئة ثم التوظيف والتجهيز ثم التقييم والتطوير ثم الرواتب.', 'راجع أنك ذكرت أربعة أبعاد، ولم تجب بقائمة الأنشطة الستة من سؤال آخر.']);
  L(34, ['shortage', 'surplus'], 'أي خيار لمعالجة نقص عمالة متوقع بطيء لكنه عالي القابلية للرجوع؟',
    'نحتاج خيارًا يطابق شرطين معًا في جدول المقرر: Slow وHigh revocability. النقل مع إعادة التدريب يتطلب وقتًا لتجهيز مهارة جديدة، لكنه يعتمد إعادة توزيع قدرة موجودة، لذا يطابق الشرطين. قابلية الرجوع تتعلق بمرونة القرار النسبي، ولا تعني استرجاع وقت التدريب أو محو ما تعلمه الموظف. التناقص الطبيعي يخفض العرض أصلًا، فلا يعالج هذا النقص.',
    ['يقلل عدد العاملين بعدم تعويض المغادرين؛ يرتبط بالفائض لا نقص العمالة.', 'الصحيح: يصنف بطيئًا وعالي القابلية للرجوع في جدول بدائل النقص.', 'يصنف سريعًا وعالي القابلية للرجوع في الجدول؛ لا يحقق شرط البطء.', 'النقل المجرد لا يحدد عنصر إعادة التدريب الذي يفسر الخيار البطيء المقصود.'],
    ['حدد أن المطلوب تجنب shortage لا تقليل surplus.', 'اجمع الشرطين: بطيء وعالي القابلية للرجوع.', 'ابحث عن تقاطعهما في الجدول؛ ستجد Retrained transfers.']);
  L(35, ['knowledge', 'training'], 'أي عبارة تفرق بصورة صحيحة بين المعرفة الضمنية والمعرفة الصريحة؟',

  }
  function questionPicker() {
    openDialog('كل الأسئلة', `<div class="picker-controls"><label class="search-box">${ic('search')}<input id="picker-search" type="search" value="${esc(state.search)}" placeholder="ابحث في السؤال أو الفكرة…" aria-label="ابحث في الأسئلة"></label><select id="picker-topic" aria-label="الفكرة"><option value="all">كل الأفكار</option>${D.topics.map(t => `<option value="${t.id}" ${state.topic === t.id ? 'selected' : ''}>${esc(t.title)} · ${ar(t.count)}</option>`).join('')}</select></div><div class="picker-filters" role="group" aria-label="تصفية الأسئلة">${[['all','الكل'],['unanswered','لم أحلّه'],['wrong','أحتاج أراجعه'],['bookmarks','علّمت عليه'],['essay','المقالي'],['shared','الأكثر تكرارًا']].map(([key,label]) => `<button class="filter-chip ${state.filter === key ? 'active' : ''}" data-action="filter" data-filter="${key}" aria-pressed="${state.filter === key}">${label}</button>`).join('')}</div><div class="picker-count" id="picker-count"></div><div class="picker-list" id="picker-list"></div>`);
    renderPicker();
    $('#picker-search').focus({preventScroll:true});
  }
  function renderPicker() {
    const list = $('#picker-list'); if (!list) return;
    const shown = D.questions.filter(q => {
      if (state.topic !== 'all' && q.topic !== state.topic) return false;
      if (state.search && !normalize(q.stem+' '+q.title+' '+q.term+' '+topics[q.topic].title).includes(normalize(state.search))) return false;
      if (state.filter === 'unanswered' && attempted(q)) return false;
      if (state.filter === 'wrong' && !wrong(q)) return false;
      if (state.filter === 'bookmarks' && !state.bookmarks.has(q.id)) return false;
      if (state.filter === 'essay' && q.type !== 'essay') return false;
      if (state.filter === 'shared' && q.frequency !== 2) return false;
      return true;
    });
    $('#picker-count').textContent = `${ar(shown.length)} سؤالًا · مرتبة حسب التكرار ثم الفكرة`;
    list.innerHTML = shown.length ? shown.map(q => `<button class="question-link ${q.id === state.current ? 'current' : ''}" data-action="pick" data-id="${q.id}"><span class="picker-number ${done(q) ? 'done' : wrong(q) ? 'wrong' : ''}">${q.order}</span><span class="picker-copy"><span class="picker-stem" dir="ltr">${esc(q.stem)}</span><small>${esc(topics[q.topic].title)}${q.frequency === 2 ? ' · مشترك بين التجميعتين' : ''}${state.bookmarks.has(q.id) ? ' · معلّم للمراجعة' : ''}</small></span>${ic('arrow')}</button>`).join('') : `<div class="empty-state"><h3>ما فيه أسئلة تطابق اختيارك</h3><p>جرّب كلمة ثانية أو اعرض كل الأسئلة.</p><button class="secondary-button" data-action="clear-filters">عرض الكل</button></div>`;
  }
  function showSource() {
    const q = byId[state.current];
    openDialog(`مصدر السؤال Q${String(q.order).padStart(2,'0')}`, `<p class="source-stem en" dir="ltr">${esc(q.stem)}</p><p>ورد في <b>${ar(q.frequency)}</b> من التجميعتين بعد الدمج. النص المعروض من <bdi dir="ltr">${esc(files[q.canonical.file].name)}</bdi>، ${esc(q.canonical.location)}.</p>${q.sources.map(s => `<div class="source-row"><strong dir="ltr">${esc(files[s.file].name)}</strong><p>${s.locations.map(esc).join('؛ ')}</p></div>`).join('')}${q.id === 37 ? '<p class="small-note">صيغة D وE برقم 52 هي: <bdi dir="ltr">Alignment of performance with strategy is:</bdi>؛ وهي الفكرة نفسها بصياغة مختصرة.</p>' : ''}`);
  }
  function showAbout() {
    openDialog('عن التدريب', `<p><b>${ar(D.questions.length)} سؤالًا بدون تكرار.</b> تحت كل سؤال أربع خانات تفتحها بالنقر: قواعد الفكرة بالمختصر، وجدول يجمع السؤال وقواعد فكرته بالمختصر والتفصيل وأسباب الخيارات، والربط الذكي، وشرح تفصيلي خطوة بخطوة مع أمثلة لكل قاعدة. المقالي معه نموذج إنجليزي وخطة للإجابة.</p><h3>ترتيب الأسئلة</h3><p>الأسئلة الثلاثة المشتركة بين التجميعتين أولًا، ثم الأسئلة التابعة للأفكار التي تغطي أسئلة أكثر. دمجنا الملفات A وB وD وE في تجميعة واحدة من ${ar(34)} سؤالًا، وقارناها بـBLUE التي تضم ${ar(17)} سؤالًا. النسخ المتكررة داخل الملف لا ترفع أولوية السؤال.</p><details class="source-files"><summary>الملفات الأصلية</summary>${D.files.map(f => `<div class="source-row"><strong dir="ltr">${f.id} · ${esc(f.name)}</strong><p>${f.group === 'blue' ? 'التجميعة ٢ · BLUE' : 'ضمن التجميعة ١'}</p></div>`).join('')}</details><h3>الإجابات والحفظ</h3><p>الاختياري والإجابة القصيرة يصححان مباشرة، والمقالي بتقييمك الذاتي. تبقى ملاحظات تدقيق الإجابات بجوار شرح السؤال التفصيلي. الإجابات وعلامات المراجعة وكتابتك محفوظة في المتصفح على هذا الجهاز.</p><button class="secondary-button reset-button" data-action="reset">${ic('repeat')}بدء جولة جديدة</button>`);
  }
  function openReset() {
    closeDialog();
    openDialog('بدء جولة جديدة', '<p>تبدأ الإجابات والتقييم الذاتي من الصفر. تبقى كتابتك وعلامات المراجعة محفوظة.</p><div class="self-assess"><button class="primary-button" data-action="confirm-reset">ابدأ الجولة</button><button class="secondary-button" data-action="close-dialog">رجوع</button></div>');
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]'); if (!button) return;
    const q = byId[state.current];
    switch (button.dataset.action) {
      case 'skip': event.preventDefault(); $('#main').focus(); break;
      case 'home': event.preventDefault(); go(D.questions[0].id); break;
      case 'questions': questionPicker(); break;
      case 'close-dialog': closeDialog(); break;
      case 'about': showAbout(); break;
      case 'source': showSource(); break;
      case 'next': step(1); break;
      case 'previous': step(-1); break;
      case 'pick': { const id = Number(button.dataset.id); closeDialog(); go(id); break; }
      case 'bookmark': {
        if (state.bookmarks.has(q.id)) state.bookmarks.delete(q.id); else state.bookmarks.add(q.id);
        save(); refresh(); $('.bookmark-button')?.focus({preventScroll:true});
        toast(state.bookmarks.has(q.id) ? 'علّمناه للمراجعة.' : 'أُزيلت علامة المراجعة.'); break;
      }
      case 'answer': {
        if (q.type !== 'mcq' || state.answers[q.id]?.correct !== undefined) break;
        const choice = Number(button.dataset.choice);
        state.answers[q.id] = {choice, correct:choice === q.answerIndex}; save(); refresh(); break;
      }
      case 'retry': delete state.answers[q.id]; save(); refresh(); break;
      case 'reveal-essay': state.answers[q.id] = {...(state.answers[q.id] || {}), revealed:!state.answers[q.id]?.revealed}; save(); refresh(); break;
      case 'grade-essay': state.answers[q.id] = {...(state.answers[q.id] || {}), revealed:true, grade:button.dataset.grade === 'good'}; save(); refresh(); break;
      case 'filter': {
        state.filter = button.dataset.filter;
        $$('.filter-chip').forEach(e => {e.classList.toggle('active', e.dataset.filter === state.filter); e.setAttribute('aria-pressed', String(e.dataset.filter === state.filter));});
        renderPicker(); break;
      }
      case 'clear-filters': state.filter = 'all'; state.search = ''; state.topic = 'all'; closeDialog(); questionPicker(); break;
      case 'reset': openReset(); break;
      case 'confirm-reset': state.answers = {}; state.checks = {}; state.sections.clear(); closeDialog(); go(D.questions[0].id); toast('بدأت جولة جديدة.'); break;
    }
  });
  // Native details give mouse, touch and keyboard the same disclosure behavior.
  document.addEventListener('toggle', event => {
    const detail = event.target;
    if (!detail.matches?.('.support-item')) return;
    const id = Number(detail.dataset.question), key = detail.dataset.section;
    // Ignore removal events from the previous question during navigation.
    if (!detail.isConnected || id !== state.current) return;
    const set = new Set(state.sections.get(id) || []);
    if (detail.open) set.add(key); else set.delete(key);
    state.sections.set(id, set);
    if (key === 'smart') { const stem = $('#stem-'+id); if (stem) stem.innerHTML = highlight(byId[id]); }
  }, true);
  document.addEventListener('input', event => {
    if (event.target.id === 'picker-search') {state.search = event.target.value; renderPicker();}
    if (event.target.matches('[data-draft]')) {state.drafts[state.current] = event.target.value; save();}
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'picker-topic') {state.topic = event.target.value; renderPicker();}
    if (event.target.matches('[data-check]')) {
      const point = Number(event.target.dataset.check), set = new Set(state.checks[state.current] || []);
      if (event.target.checked) set.add(point); else set.delete(point);
      state.checks[state.current] = [...set]; save();
    }
  });
  document.addEventListener('submit', event => {
    if (event.target.id !== 'short-form') return;
    event.preventDefault();
    const value = $('#short-input').value.trim();
    if (!value) {toast('اكتب إجابتك أولًا.'); return;}
    const term = normalize(value).replace(/[\s\-_.,،]/g, '');
    state.answers[state.current] = {value, correct:['businessmodel','نموذجالاعمال','نموذجالعمل'].includes(term)};
    state.drafts[state.current] = value; save(); refresh();
  });
  $('#info-dialog').addEventListener('click', event => {
    if (event.target !== $('#info-dialog')) return;
    const box = event.target.getBoundingClientRect();
    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closeDialog();
  });
  function handleRoute() {
    const id = routeId();
    if (byId[id] && state.current !== id) {state.current = id; save(); renderCurrent(); window.scrollTo({top:0, behavior:'instant'});}
  }
  window.addEventListener('hashchange', handleRoute);
  window.addEventListener('popstate', handleRoute);
  shell();
})();
</script>
</body>
</html>
