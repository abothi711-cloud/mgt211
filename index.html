<script>window.MGT = {"questions":[{"stem":"The training and development function of an HR department includes:","options":["Job analysis","Orientation","Performance measures","Attitude surveys"],"type":"mcq","id":23,"answerIndex":1,"groups":["main","blue"],"frequency":2,"rawOccurrences":9,"sources":[{"file":"A","locations":["س23","س34","س49"]},{"file":"B","locations":["س12"]},{"file":"C","locations":["س5"]},{"file":"D","locations":["س4 · القسم الأول","س4 · القسم الثاني"]},{"file":"E","locations":["س4 · القسم الأول","س4 · القسم الثاني"]}],"answer":"Orientation","title":"التعريف بالعمل ضمن التدريب والتطوير","simple":"Orientation من أنشطة التدريب والتطوير.","detail":"برنامج التعريف يساعد الموظف الجديد على فهم المنظمة والقواعد وطريقة العمل. لذلك يقع تحت التدريب والتطوير. Job analysis يدرس الوظيفة، وPerformance measures تقيس الأداء، وAttitude surveys تجمع اتجاهات الموظفين. سؤال الاختيار هنا لا يطلب تعريف الموارد البشرية كلها؛ يطلب نشاطًا يطابق وظيفة محددة.","example":"في اليوم الأول يتعرف الموظف على النظام والسلامة والقسم وطريقة أداء العمل؛ هذا Orientation.","link":"training and development function → Orientation","clues":["training and development"],"trap":"لا تختَر Performance measures بسبب كلمة development؛ أدوات القياس تقع أساسًا ضمن إدارة الأداء.","topic":"training","term":"Orientation","canonical":{"file":"A","location":"س23"},"order":1},{"stem":"______ is the extent to which the performance management system elicits job performance that is consistent with an organization's strategy, goals, and culture.","options":["Specificity","Reliability","Validity","Strategic congruence"],"type":"mcq","id":37,"answerIndex":3,"groups":["main","blue"],"frequency":2,"rawOccurrences":3,"sources":[{"file":"C","locations":["س7"]},{"file":"D","locations":["س52 · القسم الثالث"]},{"file":"E","locations":["س52 · القسم الثالث"]}],"answer":"Strategic congruence","title":"التوافق الاستراتيجي لنظام الأداء","simple":"مطابقة نظام الأداء للاستراتيجية والأهداف والثقافة تعني Strategic congruence.","detail":"المقياس الجيد لا يكافئ أشياء بعيدة عما تسعى المنظمة إليه. التوافق الاستراتيجي يعني أن متطلبات نظام الأداء وسلوكياته تدعم اتجاه الشركة. قد يكون المقياس ثابتًا وصادقًا من الناحية الفنية لكنه يشجع هدفًا غير مناسب لاستراتيجية المنظمة؛ عندها يضعف توافقه الاستراتيجي.","example":"شركة تتميز بجودة الخدمة لكنها تكافئ الموظف فقط على إنهاء المكالمة بسرعة مهما كانت المشكلة؛ القياس لا ينسجم جيدًا مع استراتيجيتها.","link":"strategy + goals + culture → Strategic congruence","clues":["strategy, goals, and culture"],"trap":"Specificity وضوح التوقعات، Reliability اتساق القياس، Validity قياس المطلوب؛ توافق الاستراتيجية معيار مختلف.","topic":"performance","term":"Strategic congruence","canonical":{"file":"C","location":"س7"},"order":2},{"stem":"The first step in the human resource planning process is:","options":["Forecasting","Goal setting","Program implementation","Program evaluation"],"type":"mcq","id":9,"answerIndex":0,"groups":["main","blue"],"frequency":2,"rawOccurrences":9,"sources":[{"file":"A","locations":["س9"]},{"file":"B","locations":["س6"]},{"file":"C","locations":["س1"]},{"file":"D","locations":["بداية الملف: 1 (غير مرقّم)","س20 · القسم الثاني","س38 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 1 (غير مرقّم)","س20 · القسم الثاني","س38 · القسم الثالث"]}],"answer":"Forecasting","title":"أول خطوة في تخطيط الموارد البشرية","simple":"ابدأ بالتنبؤ Forecasting: قدّر الاحتياج والعرض المتوقعين من الموظفين.","detail":"تخطيط الموارد البشرية يبدأ بمعرفة ما الذي سيحدث قبل وضع الأهداف أو تنفيذ البرامج. تتنبأ الشركة بطلبها على العاملين وبالمعروض المتوقع من داخلها وخارجها، ثم تقارن الرقمين. بعدها تحدد أهدافها وتختار برامج مواجهة النقص أو الفائض، ثم تقيّم النتائج. لا يمكنك اختيار علاج نقص الموظفين قبل اكتشافه.","example":"تحتاج الشركة العام القادم 120 موظفًا، وتتوقع بقاء 100 فقط. التنبؤ كشف نقص 20، وبعده تضع خطة التوظيف أو التدريب.","link":"first step + human resource planning → Forecasting","clues":["first step","human resource planning"],"trap":"Forecasting للتخطيط؛ Needs assessment لتصميم التدريب. حدد العملية قبل حفظ أول خطوة.","topic":"planning","term":"Forecasting","canonical":{"file":"A","location":"س9"},"order":3},{"stem":"Which type of analysis is usually conducted first when performing a needs assessment in a training process?","options":["Task analysis","Organizational analysis","Person analysis","Market analysis"],"type":"mcq","id":4,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":9,"sources":[{"file":"A","locations":["س4","س51"]},{"file":"B","locations":["س7"]},{"file":"D","locations":["س8 · القسم الأول","س8 · القسم الثاني","س54 · القسم الثالث"]},{"file":"E","locations":["س8 · القسم الأول","س8 · القسم الثاني","س54 · القسم الثالث"]}],"answer":"Organizational analysis","title":"أول تحليل في الاحتياج التدريبي","simple":"ابدأ بتحليل المنظمة Organizational analysis قبل تحليل الأشخاص والمهام.","detail":"قبل أن تسأل من يحتاج تدريبًا أو ما المهارات الناقصة، اسأل: هل التدريب مناسب لاستراتيجية الشركة؟ وهل توجد موارد ودعم لتطبيقه؟ هذا هو مستوى المنظمة. بعد ذلك يوضح تحليل الفرد Person analysis من يحتاج التدريب وهل الأداء الضعيف سببه نقص مهارة فعلًا، بينما يحدد تحليل المهمة Task analysis ما المهارات التي يتطلبها العمل.","example":"شركة تريد التوسع في البيع الإلكتروني. أولًا تراجع هدفها وميزانية التدريب ودعم المديرين، ثم تحدد من يحتاج التدريب وما الذي سيتعلمه.","link":"conducted first + needs assessment → Organizational analysis","clues":["conducted first","needs assessment"],"trap":"لا تختَر Task analysis لمجرد وجود training في السؤال؛ كلمة first هي التي تميّز المطلوب.","topic":"training","term":"Organizational analysis","canonical":{"file":"A","location":"س4"},"order":4},{"stem":"The last step in an effective onboarding process is:","options":["Clarification","Compliance","Clearance","Connection"],"type":"mcq","id":16,"answerIndex":3,"groups":["main"],"frequency":1,"rawOccurrences":6,"sources":[{"file":"A","locations":["س16","س48"]},{"file":"D","locations":["س2 · القسم الأول","س2 · القسم الثاني"]},{"file":"E","locations":["س2 · القسم الأول","س2 · القسم الثاني"]}],"answer":"Connection","title":"آخر خطوة في تهيئة الموظف الجديد","simple":"في نموذج التهيئة الوارد بالأسئلة، Connection هي المرحلة الأخيرة.","detail":"احفظ جوانب التهيئة الأربعة بمعناها: Compliance معرفة القواعد، Clarification وضوح الدور، Culture فهم ثقافة المنظمة، Connection بناء العلاقات. الموظف لا يحتاج ورقة سياسات ووصف وظيفة فقط؛ يحتاج أيضًا أشخاصًا يلجأ إليهم ويتعاون معهم. السؤال يطلب الخطوة الأخيرة وفق هذا النموذج التعليمي.","example":"بعد تعريف موظف جديد بالسياسات ومهامه وثقافة الشركة، يعرّفونه بزملائه ويخصصون له مرشدًا؛ هذا Connection.","link":"last step + onboarding → Connection","clues":["last step","onboarding"],"trap":"Orientation نشاط تعريفي ضمن التدريب؛ Connection جانب العلاقات في التهيئة، فلا تخلط بين المصطلحين.","topic":"training","term":"Connection / Onboarding","canonical":{"file":"A","location":"س16"},"order":5},{"stem":"________ is the on-the-job use of knowledge, skills, and behaviors learned in training.","options":["Information absorption","Transfer of training","Cognitive adoption","Hands-on learning"],"type":"mcq","id":18,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":3,"sources":[{"file":"A","locations":["س18"]},{"file":"D","locations":["س17 · القسم الثاني"]},{"file":"E","locations":["س17 · القسم الثاني"]}],"answer":"Transfer of training","title":"نقل أثر التدريب إلى العمل","simple":"تطبيق ما تعلمته في الوظيفة هو Transfer of training.","detail":"الحضور والفهم داخل القاعة لا يضمنان انتقال أثر التدريب. النقل يحدث عندما يستخدم المتدرب المعارف والمهارات والسلوكيات في العمل الحقيقي. يحتاج ذلك فرصة للتطبيق ودعم المدير والزملاء وملاحظات تساعده. إذا تعلم موظف طريقة ثم استمر يعمل بالطريقة القديمة، حصل تعلم لكن انتقال أثر التدريب لم يتحقق بعد.","example":"بعد دورة على برنامج المخزون، يستخدم الموظف البرنامج فعلًا لتسجيل البضاعة وتقليل الأخطاء؛ هذه مرحلة نقل أثر التدريب.","link":"on-the-job use + learned in training → Transfer of training","clues":["on-the-job use","learned in training"],"trap":"Formal training يصف طريقة تنظيم التدريب؛ Transfer يصف تطبيق نتائجه بعد التعلم.","topic":"training","term":"Transfer of training","canonical":{"file":"A","location":"س18"},"order":6},{"stem":"________ involves development programs, courses, and events developed and organized by the company.","options":["Tacit knowledge","Formal training","Transfer of training","Implicit learning"],"type":"mcq","id":26,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":5,"sources":[{"file":"A","locations":["س26","س37"]},{"file":"B","locations":["س4"]},{"file":"D","locations":["بداية الملف: 11 (غير مرقّم)"]},{"file":"E","locations":["بداية الملف: 11 (غير مرقّم)"]}],"answer":"Formal training","title":"التدريب الرسمي","simple":"البرامج والدورات التي تطورها وتنظمها الشركة هي Formal training.","detail":"التدريب الرسمي نشاط مخطط له أهداف وبرنامج وتنظيم. التعلم غير الرسمي قد يحدث بالملاحظة أو سؤال الزملاء أثناء العمل دون دورة منظمة. المعرفة الضمنية تصف نوع المعرفة وليست اسمًا لبرنامج تدريبي. أما Transfer of training فيشير إلى تطبيق ما تم تعلمه في الوظيفة.","example":"تعلن الشركة دورة يوم الثلاثاء بمدرب ومحتوى وتمارين محددة؛ هذا تدريب رسمي، حتى لو كانت الدورة عبر الإنترنت.","link":"programs, courses, and events + organized by the company → Formal training","clues":["programs, courses, and events","organized by the company"],"trap":"وجود داخل الشركة لا يعني ضمنيًا؛ وجود تنظيم وبرنامج ودورة هو مفتاح Formal.","topic":"training","term":"Formal training","canonical":{"file":"A","location":"س26"},"order":7},{"stem":"Tacit knowledge is different from explicit knowledge in that","options":["Explicit knowledge is based on personal experience","Tacit knowledge is easy to codify","Tacit knowledge can be well documented","Explicit knowledge can be easily articulated"],"type":"mcq","id":35,"answerIndex":3,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س4"]}],"answer":"Explicit knowledge can be easily articulated","title":"المعرفة الضمنية والصريحة","simple":"Explicit يسهل التعبير عنها وتوثيقها؛ Tacit مرتبطة بالخبرة ويصعب تدوينها بالكامل.","detail":"المعرفة الصريحة يمكن كتابتها في دليل أو شرحها بوضوح كخطوات. الضمنية تنشأ من الخبرة والحدس والمهارة العملية؛ يستطيع الخبير أداء العمل لكنه قد يصعب عليه وصف كل تفاصيل قراره. الخيارات الثلاثة الأولى تعكس الصفات أو تبالغ في سهولة توثيق الضمني، بينما يذكر الخيار الصحيح سهولة التعبير عن المعرفة الصريحة.","example":"وصفة مكتوبة بمقادير وخطوات = Explicit. إحساس الخباز بقوام العجين المناسب بعد سنوات من الخبرة = Tacit.","link":"Explicit + easily articulated → Correct distinction","clues":["Tacit knowledge","explicit knowledge"],"trap":"ضمنية لا تعني أنها مستحيلة التعلم؛ غالبًا تحتاج ملاحظة وممارسة وخبرة بدل قراءة تعليمات فقط.","topic":"training","term":"Tacit vs. Explicit knowledge","canonical":{"file":"C","location":"س4"},"order":8},{"stem":"A firm focuses on organizational and person analysis during the ________stage in the training design process","options":["Needs assessment","Employees' readiness assessment","Learning environment development","Transfer of training"],"type":"mcq","id":39,"answerIndex":0,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س9"]}],"answer":"Needs assessment","title":"مرحلة تقييم الاحتياجات التدريبية","simple":"Organizational وPerson وTask analysis تقع ضمن Needs assessment.","detail":"تقييم الاحتياجات يقرر هل التدريب مطلوب، ولمن، وفي ماذا. تحليل المنظمة يربطه بالاستراتيجية والدعم؛ تحليل الفرد يحدد من يحتاجه وسبب فجوة الأداء؛ تحليل المهمة يحدد المحتوى والمهارات. اختيار طريقة التدريب أو ضمان نقل أثره يأتي لاحقًا. السؤال لا يطلب أي تحليل يأتي أولًا، بل اسم المرحلة التي تضم هذه التحليلات.","example":"متجر يرى أخطاء في تسجيل المبيعات، فيفحص حاجة العمل، والأشخاص الذين يخطئون، وخطوات استخدام النظام. الثلاثة ضمن تقييم الاحتياجات.","link":"organizational and person analysis + stage → Needs assessment","clues":["organizational and person analysis"],"trap":"Organizational analysis جزء من Needs assessment، وليسا مرحلتين متنافستين في السؤال نفسه.","topic":"training","term":"Needs assessment","canonical":{"file":"C","location":"س9"},"order":9},{"type":"essay","stem":"What are the six stages in the training design process?","options":[],"id":40,"answerIndex":null,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س10"]}],"title":"مقالي مراحل تصميم التدريب الست","simple":"المراحل المطلوبة: الاحتياج، الاستعداد، بيئة التعلم، نقل التعلم، اختيار الطريقة، التقييم.","detail":"ابدأ بتحديد سبب التدريب والفجوات، ثم تأكد من استعداد الموظفين ودافعيتهم ومهاراتهم الأساسية. أنشئ بيئة فيها أهداف واضحة ومادة مناسبة وممارسة وتغذية راجعة. خطط لتطبيق المهارة في العمل بدعم المدير والزملاء. اختر الطريقة المناسبة للمحتوى، ثم قيّم نتائج التدريب وفق أهدافه. هذه هي صيغة المراحل الست الواردة في BLUE، وقد تختلف طريقة دمج المراحل في أطر تعليمية أخرى.","example":"لتدريب فريق على نظام جديد: نحدد الأخطاء، نفحص المهارات الأساسية، نجهز تمارين، ندعم التطبيق في العمل، نختار ورشة عملية، ثم نقيس انخفاض الأخطاء.","link":"six stages → Need, Ready, Learn, Transfer, Method, Evaluate","clues":["six stages","training design process"],"trap":"السؤال يطلب ست مراحل حسب هذه الصيغة؛ لا تخلط مراحل التصميم مع التحليلات الثلاثة داخل أول مرحلة.","answer":"The six stages are needs assessment; ensuring employees’ readiness for training; creating a learning environment; ensuring transfer of learning; selecting training methods; and evaluating training programs. Needs assessment identifies the gap, readiness checks motivation and basic skills, and evaluation checks whether the intended learning and work outcomes were achieved.","answerPoints":["Needs assessment","Readiness","Learning environment","Transfer of learning","Training methods","Program evaluation"],"topic":"training","term":"Training design process","canonical":{"file":"C","location":"س10"},"order":10},{"stem":"________ analysis involves determining the business appropriateness of training, given the company's business strategy.","options":["Person","Organizational","Task","Information"],"type":"mcq","id":46,"answerIndex":1,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س16"]}],"answer":"Organizational","title":"ملاءمة التدريب لاستراتيجية الشركة","simple":"تحديد مدى مناسبة التدريب للأعمال والاستراتيجية هو Organizational analysis.","detail":"ينظر تحليل المنظمة إلى لماذا ندرّب: هل يدعم التدريب الاتجاه الاستراتيجي؟ وهل توجد موارد ووقت ودعم من الإدارة؟ تحليل الفرد يراجع من يحتاج التدريب، وتحليل المهمة يراجع ما يلزم تعلمه لأداء العمل. لهذا يرتبط business appropriateness وbusiness strategy بالمستوى التنظيمي.","example":"الشركة تريد دخول سوق جديد؛ تفحص هل تدريب الفريق على لغة العملاء يدعم هذا الهدف، وهل الميزانية والمديرون جاهزون.","link":"business appropriateness + business strategy → Organizational analysis","clues":["business appropriateness","business strategy"],"trap":"إذا ركز السؤال على محتوى المهارة اللازمة لوظيفة معينة، فابحث عن Task analysis بدلًا من ذلك.","topic":"training","term":"Organizational analysis","canonical":{"file":"C","location":"س16"},"order":11},{"stem":"Which of the following is true regarding behavioral approaches to performance measurement?","options":["They link the company's strategy to the specific behavior necessary to implement that strategy.","They adopt a very subjective approach.","They have low validity and acceptability.","They assume multiple best ways to do the job."],"type":"mcq","id":11,"answerIndex":0,"groups":["main"],"frequency":1,"rawOccurrences":11,"sources":[{"file":"A","locations":["س11","س29","س41"]},{"file":"D","locations":["بداية الملف: 5 (غير مرقّم)","بداية الملف: 13 (غير مرقّم)","س16 · القسم الثاني","س42 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 5 (غير مرقّم)","بداية الملف: 13 (غير مرقّم)","س16 · القسم الثاني","س42 · القسم الثالث"]}],"answer":"They link the company's strategy to the specific behavior necessary to implement that strategy.","title":"الأساليب السلوكية لقياس الأداء","simple":"الأساليب السلوكية تربط الاستراتيجية بسلوكيات محددة قابلة للملاحظة.","detail":"بدل أن تكتفي بقول الموظف ممتاز أو ضعيف، تحدد السلوك الذي يحقق الهدف. إذا كانت الاستراتيجية خدمة عملاء متميزة، فقد يقاس الإصغاء للعميل والمتابعة وحل الشكوى. هذه السلوكيات تحوّل الاستراتيجية العامة إلى تصرفات عملية. لا يعني ذلك أن كل أسلوب سلوكي مثالي أو أن كل وظيفة تؤدى بطريقة واحدة دائمًا.","example":"هدف الشركة سرعة الخدمة. سلوك قابل للملاحظة: يراجع الموظف الطلب فور وصوله ويبلغ العميل بأي تأخير، بدل صفة عامة مثل لطيف.","link":"strategy + specific behavior → Behavioral approach","clues":["behavioral approaches"],"trap":"إذا ورد توافق النظام مع الاستراتيجية والثقافة كمعيار عام، فالمطلوب قد يكون Strategic congruence؛ هنا السؤال عن أسلوب القياس نفسه.","topic":"performance","term":"Behavioral approaches","canonical":{"file":"A","location":"س11"},"order":12},{"stem":"________ is the degree to which a measure is free from random error.","options":["Reliability","Validity","Generalizability","Utility"],"type":"mcq","id":12,"answerIndex":0,"groups":["main"],"frequency":1,"rawOccurrences":5,"sources":[{"file":"A","locations":["س12"]},{"file":"D","locations":["س23 · القسم الثاني","س51 · القسم الثالث"]},{"file":"E","locations":["س23 · القسم الثاني","س51 · القسم الثالث"]}],"answer":"Reliability","title":"الثبات والخطأ العشوائي","simple":"خلو المقياس من الخطأ العشوائي يعني Reliability.","detail":"الثبات يعني أن القياس متسق ولا تقوده مصادفات عشوائية. الصدق Validity يسأل سؤالًا آخر: هل يقيس الشيء المطلوب فعلًا؟ قد يعطي ميزان خاطئ النتيجة نفسها كل مرة؛ يكون ثابتًا لكنه غير صادق في قياس الوزن الحقيقي. لا تخلط بين consistency وبين accuracy of the intended construct.","example":"اختبار مهارة يعطي موظفًا المستوى نفسه تقريبًا عند تكراره في ظروف متشابهة؛ هذا يدعم الثبات.","link":"free from random error → Reliability","clues":["free from random error"],"trap":"Reliability = الاتساق؛ Validity = قياس المطلوب. قد يجتمعان وقد يوجد أحدهما دون الآخر.","topic":"performance","term":"Reliability","canonical":{"file":"A","location":"س12"},"order":13},{"stem":"Which aspect of emotional intelligence is the knowledge of one's strengths and weaknesses?","options":["Self-motivation","Empathy","Social skill","Self-awareness"],"type":"mcq","id":13,"answerIndex":3,"groups":["main"],"frequency":1,"rawOccurrences":8,"sources":[{"file":"A","locations":["س13","س43"]},{"file":"D","locations":["بداية الملف: 7 (غير مرقّم)","س22 · القسم الثاني","س44 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 7 (غير مرقّم)","س22 · القسم الثاني","س44 · القسم الثالث"]}],"answer":"Self-awareness","title":"معرفة نقاط قوتك وضعفك","simple":"معرفة الإنسان بمشاعره ونقاط قوته وضعفه هي Self-awareness.","detail":"الوعي بالذات يعني أن تفهم نفسك وتعرف كيف تؤثر حالتك ومهاراتك في تصرفاتك. التعاطف Empathy يركز على فهم الآخرين. المهارات الاجتماعية تركز على إدارة العلاقات، والدافع الذاتي يركز على تحريك النفس للعمل. صاحب السؤال يريد جانبًا يتعلق بمعرفة الشخص نفسه، لذلك الوعي بالذات هو الأنسب.","example":"موظف يعرف أنه بارع في التحليل لكنه يتوتر عند التحدث أمام الجمهور؛ هذه معرفة بالذات، حتى قبل أن يبدأ تحسين مهارته.","link":"one’s strengths and weaknesses → Self-awareness","clues":["strengths and weaknesses"],"trap":"نفسك = Self-awareness؛ مشاعر الآخرين = Empathy.","topic":"performance","term":"Self-awareness","canonical":{"file":"A","location":"س13"},"order":14},{"stem":"The technique that consists of having multiple raters above, equal to, and below the manager providing input into a manager's evaluation is:","options":["Background check","360-degree appraisal","Upward feedback","Performance appraisal"],"type":"mcq","id":14,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":6,"sources":[{"file":"A","locations":["س14","س47"]},{"file":"D","locations":["بداية الملف: 14 (غير مرقّم)","س21 · القسم الثاني"]},{"file":"E","locations":["بداية الملف: 14 (غير مرقّم)","س21 · القسم الثاني"]}],"answer":"360-degree appraisal","title":"تقييم 360 درجة","simple":"جمع تقييمات من الأعلى والمستوى نفسه والأسفل يعني 360-degree appraisal.","detail":"التقييم متعدد الجهات يجمع منظور المدير والزملاء والمرؤوسين، وقد يضيف العميل والتقييم الذاتي. المقصود بصورة 360 أن الأداء يُرى من اتجاهات متعددة، لا من جهة المدير وحدها. Upward feedback جزء أضيق: المرؤوسون يقيّمون المدير. لذلك لا يكفي لوصف جميع الجهات الواردة في السؤال.","example":"مدير فريق يتلقى رأي مديره، ومدير آخر في مستواه، وأعضاء فريقه؛ التقييم هنا 360 درجة.","link":"above + equal to + below → 360-degree appraisal","clues":["above, equal to","below"],"trap":"وجود تقييم من المرؤوسين وحده لا يجعل العملية 360؛ ابحث عن تعدد الجهات.","topic":"performance","term":"360-degree appraisal","canonical":{"file":"A","location":"س14"},"order":15},{"stem":"Sara was hired to provide coaching to a work unit that is underperforming. This is part of:","options":["Recruitment and selection","Compensation and benefits","Employee relations","Performance management"],"type":"mcq","id":27,"answerIndex":3,"groups":["main"],"frequency":1,"rawOccurrences":6,"sources":[{"file":"A","locations":["س27","س38","س44"]},{"file":"B","locations":["س1"]},{"file":"D","locations":["بداية الملف: 9 (غير مرقّم)"]},{"file":"E","locations":["بداية الملف: 9 (غير مرقّم)"]}],"answer":"Performance management","title":"التوجيه لتحسين الأداء","simple":"Coaching لوحدة ضعيفة الأداء يدخل ضمن Performance management.","detail":"إدارة الأداء لا تقتصر على إعطاء درجة سنوية. تشمل تحديد التوقعات ومراقبة النتائج وتقديم التغذية الراجعة والتوجيه لتحسين الأداء. سارة لم تُوظّف لاختيار متقدمين أو حساب الرواتب؛ مهمتها مساعدة فريق يعمل بالفعل لكنه أقل من المستوى المطلوب، لذلك تتبع وظيفة إدارة الأداء.","example":"فريق خدمة العملاء يتأخر في حل الشكاوى. يجلس المدرب معهم ليراجع الحالات ويصحح أسلوب العمل ويتابع التحسن.","link":"coaching + underperforming → Performance management","clues":["coaching","underperforming"],"trap":"التوجيه قد يتضمن تعلمًا، لكن الوظيفة المطلوبة هنا مرتبطة مباشرة بعلاج أداء وحدة قائمة.","topic":"performance","term":"Performance management","canonical":{"file":"A","location":"س27"},"order":16},{"type":"essay","stem":"Discuss the ways a manager can improve the performance feedback process.","options":[],"id":28,"answerIndex":null,"groups":["main"],"frequency":1,"rawOccurrences":5,"sources":[{"file":"A","locations":["س54"]},{"file":"D","locations":["مقالي التغذية الراجعة","مقالي التغذية الراجعة (مكرر)"]},{"file":"E","locations":["مقالي التغذية الراجعة","مقالي التغذية الراجعة (مكرر)"]}],"title":"مقالي تحسين التغذية الراجعة","simple":"اجعل التغذية الراجعة مستمرة ومحددة وسلوكية وتشاركية، ثم اتفق على أهداف وتابعها.","detail":"المدير الفعال يوضح السلوك أو النتيجة بأمثلة، ولا يحوّل الملاحظة إلى حكم على شخصية الموظف. يتيح للموظف شرح وجهة نظره، ويحدد معه إجراءً قابلًا للتنفيذ. من عناصر العملية: الاستعداد للنقاش، وقت مناسب وخصوصية، التركيز على حل المشكلة، تعزيز الجيد، وضع أهداف ومتابعة التحسن. احفظ سلسلة: مثال واضح → حوار → خطة → متابعة.","example":"بدل أنت مهمل، قل: في آخر أسبوع تأخر تقريران عن الموعد. ما السبب؟ لنتفق على إرسال مسودة قبل الموعد بيوم، ونراجع النتيجة بعد أسبوعين.","link":"feedback process → specific behavior + dialogue + goals + follow-up","clues":["feedback process"],"trap":"تجنب انتظار التقييم السنوي أو الاكتفاء بانتقاد الشخصية دون إجراء واضح.","answer":"Managers should give feedback regularly and in a suitable setting. They should use specific examples, focus on behaviors and results rather than personality, invite the employee’s views, and work together on solutions. They should set clear improvement goals, recognize effective performance, and follow up on progress.","answerPoints":["Regular and timely feedback","Specific behavioral examples","Two-way discussion","Clear goals and follow-up"],"topic":"performance","term":"Performance feedback","canonical":{"file":"A","location":"س54"},"order":17},{"stem":"A measure that results in drastically different ratings over time lacks ___ reliability.","options":["Internal consistency","Interrater","Parallel-forms","Test-retest"],"type":"mcq","id":36,"answerIndex":3,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س6"]}],"answer":"Test-retest","title":"الثبات عبر الزمن Test-retest","simple":"تغيّر التقييمات جدًا عند تكرار القياس بمرور الوقت يشير إلى ضعف Test-retest reliability.","detail":"الثبات له أكثر من صورة. Test-retest يقارن نتائج الأداة نفسها على فترات في ظروف متقاربة. Interrater يقارن المقيمين، وInternal consistency يقارن اتساق بنود الأداة، وParallel forms يقارن نسخًا متكافئة. السؤال يذكر over time، لذلك نختار النوع المرتبط بالزمن، لا مجرد مصطلح Reliability العام.","example":"موظف بمستوى ثابت يأخذ الاختبار مرتين بفارق قصير فيحصل على 90 ثم 35 دون سبب أداء واضح؛ الأداة تثير مشكلة ثبات عبر الزمن.","link":"different ratings + over time → Test-retest reliability","clues":["different ratings over time"],"trap":"إذا اختلف مدير وزميل في التقييم فالمشكلة Interrater؛ إذا اختلفت النتيجة مع الوقت فهي Test-retest.","topic":"performance","term":"Test-retest reliability","canonical":{"file":"C","location":"س6"},"order":18},{"stem":"The__________ is a measure of the degree to which two sets of numbers are related.","options":["Utility score","Standard deviation","Correlation coefficient","Validity score"],"type":"mcq","id":41,"answerIndex":2,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س11"]}],"answer":"Correlation coefficient","title":"معامل الارتباط","simple":"درجة العلاقة بين مجموعتين من الأرقام تُقاس بـ Correlation coefficient.","detail":"معامل الارتباط يصف اتجاه وقوة العلاقة العددية بين متغيرين. قد ترتفع القيمتان معًا أو تتحركان في اتجاهين متعاكسين. الانحراف المعياري Standard deviation يصف تشتت متغير، وليس العلاقة بين مجموعتين. والارتباط وحده لا يثبت أن أحد المتغيرين سبب الآخر؛ السؤال هنا يطلب اسم المقياس فقط.","example":"نقارن درجات اختبار قبول بدرجات أداء الموظفين لاحقًا لنرى قوة العلاقة بين المجموعتين؛ نستخدم معامل الارتباط.","link":"two sets of numbers + related → Correlation coefficient","clues":["two sets of numbers","related"],"trap":"تشتت مجموعة واحدة = Standard deviation؛ علاقة مجموعتين = Correlation coefficient.","topic":"performance","term":"Correlation coefficient","canonical":{"file":"C","location":"س11"},"order":19},{"stem":"Sara is looking for a job that will be quick to learn and not require a lot of thinking, so she can earn money and still focus on earning her degree. She is looking for a job that follows the approach.","options":["Motivational","Mechanistic","Biological","Perceptual-motor"],"type":"mcq","id":1,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":8,"sources":[{"file":"A","locations":["س1","س50"]},{"file":"D","locations":["س6 · القسم الأول","س6 · القسم الثاني","س46 · القسم الثالث"]},{"file":"E","locations":["س6 · القسم الأول","س6 · القسم الثاني","س46 · القسم الثالث"]}],"answer":"Mechanistic","title":"الوظيفة السهلة والمنهج الآلي","simple":"سهولة التعلّم، التكرار، وقلة التفكير تشير إلى Mechanistic approach.","detail":"المنهج الآلي يصمّم الوظيفة كخطوات محددة ومتكررة حتى يتعلمها العامل بسرعة. الفكرة ليست أنه يعمل على آلة بالضرورة، بل أن المهمة نفسها بسيطة ومتخصصة. المنهج التحفيزي Motivational يعطي تنوعًا واستقلالية ومعنى أكبر، والمنهج البيولوجي يهتم بتخفيف الجهد الجسدي. سارة تريد توفير انتباهها للدراسة، لذلك تطلب وظيفة لا تحتاج تفكيرًا مستمرًا.","example":"موظف يضع ملصقًا على العلبة بالطريقة نفسها كل مرة يحتاج تدريبًا قصيرًا: هذا تصميم آلي. موظف يبتكر حلولًا مختلفة للعملاء يحتاج تنوعًا وتفكيرًا أكبر.","link":"quick to learn + not require a lot of thinking → Mechanistic","clues":["quick to learn","not require a lot of thinking"],"trap":"لا تربط Biological بسهولة التعلّم؛ كلمة physical أو fatigue هي التي تقود للمنهج البيولوجي.","topic":"work","term":"Mechanistic approach","canonical":{"file":"A","location":"س1"},"order":20},{"stem":"As a company prepares to look for talent in a particular position or group, it evaluates the tasks needed, completes a talent inventory of current skill sets, and prepares a job description with KSAs. This practice is also known as:","options":["Job analysis","Internal analysis","External analysis","Job design"],"type":"mcq","id":3,"answerIndex":0,"groups":["main"],"frequency":1,"rawOccurrences":7,"sources":[{"file":"A","locations":["س3","س52"]},{"file":"B","locations":["س14"]},{"file":"D","locations":["س11 · القسم الثاني","س56 · القسم الثالث"]},{"file":"E","locations":["س11 · القسم الثاني","س56 · القسم الثالث"]}],"answer":"Job analysis","title":"تحليل الوظيفة ومتطلبات KSAs","simple":"جمع معلومات عن المهام والمهارات المطلوبة هو Job analysis.","detail":"تحليل الوظيفة يجمع معلومات عن العمل ومن يؤديه. يحدد المهام والمسؤوليات ثم المعارف والمهارات والقدرات المطلوبة. قد ينتج عنه وصف وظيفي يشرح العمل ومواصفات وظيفية تصف الشخص المناسب. تصميم الوظيفة Job design مختلف: يقرر كيف نرتّب المهام أصلًا أو نغيّرها، وليس فقط كيف نصف الموجود.","example":"قبل توظيف محاسب، تسجل الشركة أعماله اليومية، البرامج المستخدمة، والخبرة المطلوبة. هذه دراسة للوظيفة؛ أي تحليل وظيفة.","link":"evaluates the tasks + KSAs → Job analysis","clues":["tasks","KSAs"],"trap":"وجود كلمة description في القصة لا يجعل الجواب Job design؛ انظر إلى عملية جمع وتحليل المعلومات كلها.","topic":"work","term":"Job analysis","canonical":{"file":"A","location":"س3"},"order":21},{"stem":"The final stage in work-flow analysis is to identify the work_____ in the development of the work unit's product.","options":["Results","Process","Relationship","Inputs"],"type":"mcq","id":5,"answerIndex":3,"groups":["main"],"frequency":1,"rawOccurrences":10,"sources":[{"file":"A","locations":["س5","س30","س46"]},{"file":"B","locations":["س9"]},{"file":"D","locations":["بداية الملف: 12 (غير مرقّم)","س25 · القسم الثاني","س53 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 12 (غير مرقّم)","س25 · القسم الثاني","س53 · القسم الثالث"]}],"answer":"Inputs","title":"آخر مرحلة في تحليل تدفق العمل","simple":"ترتيب التحليل: Outputs ثم Processes ثم Inputs؛ المرحلة الأخيرة هي Inputs.","detail":"في تحليل تدفق العمل نبدأ من النهاية المطلوبة: ما المنتج أو الخدمة؟ ثم نرجع إلى الأنشطة التي تصنعه، ثم إلى الموارد اللازمة لهذه الأنشطة: أشخاص ومواد ومعدات. هذا ترتيب التحليل. أما التنفيذ الفعلي للإنتاج فيسير من المدخلات إلى الأنشطة إلى المخرجات. الخلط بين التحليل والتنفيذ هو سبب الخطأ في بعض مفاتيح التجميعات.","example":"لمحل قهوة: نحدد أولًا كوب القهوة المطلوب، ثم خطوات تحضيره، ثم البن والماء والآلة ومهارة الموظف. ما نحدده أخيرًا في التحليل هو المدخلات.","link":"final stage + work-flow analysis → Inputs","clues":["final stage","work-flow analysis"],"trap":"Results هي نقطة البداية عند التحليل، حتى لو كانت آخر ما يظهر في التنفيذ.","correction":{"title":"تصحيح مفتاح الإجابة","text":"بعض النسخ تحدد Results أو Process. الصحيح هنا Inputs؛ نحلّل المخرجات أولًا، ثم العمليات، ثم المدخلات. احتفظنا بنص السؤال وخياراته من MID MGT211، وصححنا الاختيار.","url":"https://www.csun.edu/~swalkerl/M460/2009.2/PDF/Chap004.pdf","label":"شرائح McGraw-Hill / Noe، فصل تحليل وتصميم العمل"},"topic":"work","term":"Work-flow analysis","canonical":{"file":"B","location":"س9"},"order":22},{"stem":"Ahmed was recently hired as a new manager. He is looking for the individuals and units to see the relationships between them. He is examining the:","options":["Work-flow analysis","Organization structure","Work-flow evaluation","Work-flow design"],"type":"mcq","id":7,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":7,"sources":[{"file":"A","locations":["س7"]},{"file":"D","locations":["بداية الملف: 8 (غير مرقّم)","س24 · القسم الثاني","س45 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 8 (غير مرقّم)","س24 · القسم الثاني","س45 · القسم الثالث"]}],"answer":"Organization structure","title":"العلاقات بين الأفراد والوحدات","simple":"معرفة من يتبع من وكيف ترتبط الإدارات تعني Organization structure.","detail":"الهيكل التنظيمي يقدم صورة للعلاقات بين الأفراد والوحدات: خطوط السلطة، أقسام الشركة، ومن يرفع تقريره لمن. أما تدفق العمل فيتابع انتقال المدخلات عبر أنشطة حتى تصبح مخرجات. أحمد يريد رؤية العلاقات بين أشخاص ووحدات، لا خطوات إنتاج منتج، لذلك يحتاج الهيكل التنظيمي.","example":"في رسم الشركة: موظفو المبيعات تحت مدير المبيعات، ومدير المبيعات تحت المدير العام. هذا هيكل تنظيمي.","link":"relationships between individuals and units → Organization structure","clues":["relationships"],"trap":"العلاقات بين الوحدات = Structure؛ تحوّل الموارد إلى منتج عبر خطوات = Work-flow.","topic":"work","term":"Organization structure","canonical":{"file":"A","location":"س7"},"order":23},{"stem":"The goal of the biological approach to job design is to:","options":["Make the work simple so anyone can be trained quickly.","Reduce the physical demands of certain jobs by improving the physical work environment.","Improve employees’ physical capabilities.","Distribute jobs only to specialized individuals."],"type":"mcq","id":8,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":3,"sources":[{"file":"A","locations":["س8"]},{"file":"D","locations":["س13 · القسم الثاني"]},{"file":"E","locations":["س13 · القسم الثاني"]}],"answer":"Reduce the physical demands of certain jobs by improving the physical work environment.","title":"تخفيف الجهد الجسدي في تصميم الوظيفة","simple":"تقليل الإجهاد البدني وتحسين بيئة العمل يشيران إلى Biological approach.","detail":"المنهج البيولوجي يرتبط بالأرغونومكس Ergonomics: ملاءمة العمل لجسم الإنسان. يغيّر ارتفاع الطاولة أو شكل الأداة أو طريقة الرفع لتقليل الألم والإرهاق. لا يعني تقوية جسم الموظف ولا توزيع الوظيفة على رياضيين فقط. الأداة الأساسية هي تحسين تصميم المكان والمهام لتقليل المتطلبات الجسدية.","example":"رفع شاشة الحاسب لمستوى العين واستخدام كرسي مناسب يقللان إجهاد الرقبة والظهر؛ هذا تطبيق بيولوجي.","link":"physical demands + physical work environment → Biological","clues":["biological approach"],"trap":"تقليل الجهد الجسدي يختلف عن تقليل التفكير والتدريب في المنهج الآلي.","topic":"work","term":"Biological approach","canonical":{"file":"A","location":"س8"},"order":24},{"stem":"Which of the following includes the knowledge, skills, abilities, and other characteristics required to perform a job?","options":["Job specification","Job description","Job satisfaction","Job evaluation"],"type":"mcq","id":22,"answerIndex":0,"groups":["main"],"frequency":1,"rawOccurrences":8,"sources":[{"file":"A","locations":["س22","س33"]},{"file":"D","locations":["س5 · القسم الأول","س5 · القسم الثاني","س55 · القسم الثالث"]},{"file":"E","locations":["س5 · القسم الأول","س5 · القسم الثاني","س55 · القسم الثالث"]}],"answer":"Job specification","title":"مواصفات الشخص أم وصف الوظيفة؟","simple":"المعارف والمهارات والقدرات المطلوبة في الشخص هي Job specification.","detail":"الوصف الوظيفي Job description يجيب: ماذا يعمل صاحب الوظيفة؟ أما المواصفات الوظيفية Job specification فتجيب: ما الذي يجب أن يمتلكه الشخص لأداء العمل؟ وتشمل Knowledge, Skills, Abilities and Other characteristics. تحليل الوظيفة هو العملية التي تجمع المعلومات اللازمة لإنتاج هذين النوعين.","example":"يستقبل العملاء ويعد التقارير = وصف وظيفي. إجادة الإنجليزية وسرعة الكتابة ومهارة التواصل = مواصفات وظيفية.","link":"knowledge + skills + abilities required → Job specification","clues":["knowledge, skills, abilities"],"trap":"Description = واجبات العمل؛ Specification = متطلبات الشخص؛ Analysis = عملية جمع المعلومات.","topic":"work","term":"Job specification","canonical":{"file":"A","location":"س22"},"order":25},{"stem":"The tasks performed as a part of job analysis.","options":["Are mutually exclusive of those of job design","Focus primarily on creating new jobs","Focus primarily on revamping existing jobs","Have a passive, information- gathering orientation"],"type":"mcq","id":42,"answerIndex":3,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س12"]}],"answer":"Have a passive, information- gathering orientation","title":"تحليل الوظائف يجمع المعلومات","simple":"مهام Job analysis ذات توجه وصفي لجمع المعلومات عن العمل القائم.","detail":"التحليل يسأل: ما المهام؟ وما المعرفة والقدرات اللازمة؟ لذلك وصفه بأنه passive, information-gathering يعني أنه يجمع بيانات عن الوظيفة بدل أن يغيرها مباشرة. أما Job design فيحدد ترتيب المهام أو يعيد تصميم العمل. التحليل والتصميم مرتبطان؛ معلومات التحليل قد تقود إلى قرار تصميم جديد، ولذلك ليسا متنافيين.","example":"المحلل يلاحظ كيف يسجل الموظف الطلب ويسأل عن المهارات المطلوبة. عندما يقرر المدير دمج مرحلتين أو تغيير توزيع المهام ينتقل إلى التصميم.","link":"job analysis → passive, information-gathering orientation","clues":["tasks performed","job analysis"],"trap":"كلمة passive هنا تعني الدور الوصفي مقابل التغيير، ولا تعني أن المحلل لا يبذل جهدًا.","topic":"work","term":"Job analysis vs. Job design","canonical":{"file":"C","location":"س12"},"order":26},{"stem":"provides a longitudinal overview of the dynamic relationships by lips by which inputs are converted into outputs.","options":["Job analysis","Organization structure","Organizational dynamics","Work-flow design"],"type":"mcq","id":47,"answerIndex":3,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س17"]}],"answer":"Work-flow design","title":"تدفق العمل عبر الزمن","simple":"الصورة المتتابعة لتحول المدخلات إلى مخرجات هي Work-flow design.","detail":"تصميم تدفق العمل يربط الأنشطة والمدخلات والمخرجات على امتداد العملية. كلمة longitudinal تعني أننا نتابع تطور العمل عبر المراحل والزمن. الهيكل التنظيمي أقرب إلى صورة ثابتة للعلاقات بين الأشخاص والوحدات في لحظة ما. النص المرفق يحتوي كلمات مطبعية زائدة، لكن القرينة الواضحة هي inputs are converted into outputs.","example":"طلب عميل يصل، ثم يُجهز، ثم يُراجع، ثم يُرسل. تتبع هذه السلسلة وتحول الموارد إلى خدمة يوضح تدفق العمل.","link":"longitudinal + inputs converted into outputs → Work-flow design","clues":["longitudinal overview","inputs","outputs"],"trap":"علاقات أشخاص ووحدات = Organization structure؛ سلسلة إنتاج وتحويل = Work-flow design.","topic":"work","term":"Work-flow design","canonical":{"file":"C","location":"س17"},"order":27},{"stem":"XYZ Inc. is an online retailer of electronic products, including laptops and tablets. The company is known for its unique approach to customer support, which goes above and beyond in satisfying customer complaints and issues. What kind of strategy is XYZ Inc. using?","options":["Cost leadership","Differentiation","Penetration","Disintermediation"],"type":"mcq","id":2,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":7,"sources":[{"file":"A","locations":["س2","س45"]},{"file":"B","locations":["س8"]},{"file":"D","locations":["بداية الملف: 10 (غير مرقّم)","س14 · القسم الثاني"]},{"file":"E","locations":["بداية الملف: 10 (غير مرقّم)","س14 · القسم الثاني"]}],"answer":"Differentiation","title":"التميّز في خدمة العملاء","simple":"خدمة استثنائية تميّز الشركة عن المنافسين تعني Differentiation.","detail":"استراتيجية التميّز تعطي العميل سببًا مختلفًا لاختيار الشركة: خدمة أفضل، جودة أعلى، تصميم خاص أو تجربة مميزة. قيادة التكلفة Cost leadership تركّز على خفض التكلفة، وليس مجرد إرضاء العميل. السؤال يشدد على الدعم الذي يتجاوز المتوقع؛ هذه قيمة مميزة، ولم يذكر أرخص سعر.","example":"متجران يبيعان اللابتوب نفسه. أحدهما يقدم دعمًا سريعًا ومتابعة شخصية وحلولًا غير معتادة؛ ميّزته هنا الخدمة، وليس انخفاض التكلفة.","link":"unique approach + above and beyond → Differentiation","clues":["unique approach","customer support"],"trap":"اختَر Cost leadership عندما تتمحور القصة حول الأقل تكلفة، لا لمجرد أن الشركة متجر إلكتروني.","topic":"strategy","term":"Differentiation","canonical":{"file":"A","location":"س2"},"order":28},{"stem":"Which of the following is the lowest level of integration between HRM and strategic management?","options":["Administrative linkage","Two-way linkage","Integrative linkage","One-way linkage"],"type":"mcq","id":24,"answerIndex":0,"groups":["main"],"frequency":1,"rawOccurrences":9,"sources":[{"file":"A","locations":["س24","س35"]},{"file":"B","locations":["س15"]},{"file":"D","locations":["س3 · القسم الأول","س3 · القسم الثاني","س47 · القسم الثالث"]},{"file":"E","locations":["س3 · القسم الأول","س3 · القسم الثاني","س47 · القسم الثالث"]}],"answer":"Administrative linkage","title":"أقل مستوى للربط الاستراتيجي","simple":"Administrative linkage هو أدنى مستوى لربط HRM بالإدارة الاستراتيجية.","detail":"في الربط الإداري تنشغل الموارد البشرية بالمهام الإدارية اليومية ويكون ارتباطها بالتخطيط الاستراتيجي ضعيفًا. في One-way تصل الاستراتيجية إلى HR لتنفذ المطلوب. في Two-way تشارك HR بتقديم معلومات ثم يعود القرار إليها للتنفيذ. في Integrative تكون HR جزءًا مستمرًا من الفريق الاستراتيجي.","example":"شركة تضع استراتيجيتها دون إشراك HR، وتتركها فقط للرواتب والأوراق؛ هذا المستوى الإداري الأدنى.","link":"lowest level + integration → Administrative linkage","clues":["lowest level","integration"],"trap":"وجود one في One-way لا يجعله المستوى الأول؛ Administrative أضعف منه في المشاركة الاستراتيجية.","topic":"strategy","term":"Administrative linkage","canonical":{"file":"A","location":"س24"},"order":29},{"stem":"Huda is leading strategic groups through a SWOT analysis to define the company’s mission and goals. She is employing:","options":["Strategy implementation","Task design","Selection and training","Strategy formulation"],"type":"mcq","id":25,"answerIndex":3,"groups":["main"],"frequency":1,"rawOccurrences":12,"sources":[{"file":"A","locations":["س25","س36","س42"]},{"file":"B","locations":["س3"]},{"file":"D","locations":["بداية الملف: 6 (غير مرقّم)","س1 · القسم الأول","س1 · القسم الثاني","س43 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 6 (غير مرقّم)","س1 · القسم الأول","س1 · القسم الثاني","س43 · القسم الثالث"]}],"answer":"Strategy formulation","title":"تحديد الاستراتيجية باستخدام SWOT","simple":"تحديد الرسالة والأهداف وتحليل SWOT يعني Strategy formulation.","detail":"صياغة الاستراتيجية تحدد اتجاه المنظمة وما تريد تحقيقه بناءً على نقاط القوة والضعف والفرص والتهديدات. التنفيذ Strategy implementation يأتي بعد اختيار الاتجاه ويحوّله إلى أعمال وموارد وموظفين مناسبين. هدى تناقش الرسالة والأهداف وتستخدم SWOT؛ هذه مرحلة اختيار الاستراتيجية، لا تطبيقها بعد اعتمادها.","example":"قرر متجر أن يتميز بخدمة ما بعد البيع بعد مراجعة نقاط قوته وفرص السوق؛ هذه صياغة. تدريب فريق الدعم لتنفيذ القرار خطوة تنفيذ.","link":"mission and goals + SWOT → Strategy formulation","clues":["mission and goals","SWOT"],"trap":"صياغة = نختار الاتجاه؛ تنفيذ = نجهز الناس والأنظمة لتطبيقه.","topic":"strategy","term":"Strategy formulation","canonical":{"file":"A","location":"س25"},"order":30},{"stem":"An organization uses___________ to measure the quantity and quality of its resources.","options":["Job modeling","Realistic job preview","Internal analysis","Value chain analys1s"],"type":"mcq","id":38,"answerIndex":2,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س8"]}],"answer":"Internal analysis","title":"التحليل الداخلي وموارد المنظمة","simple":"تقييم كمية الموارد وجودتها هو Internal analysis.","detail":"التحليل الداخلي يبحث داخل المنظمة عن الموارد والقدرات ونقاط القوة والضعف. التحليل الخارجي يراجع فرص وتهديدات البيئة. إذا سأل النص عن quantity and quality of its resources، فالمنظمة تقيس ما تملكه هي؛ لذلك Internal analysis هو الأنسب. لا تخلطه بتحليل وظيفة واحدة أو معاينة واقعية لوظيفة.","example":"تحصر الشركة خبرة الموظفين وجودة المعدات والقدرة المالية لتعرف ما تستطيع تنفيذه؛ هذا تحليل داخلي.","link":"quantity and quality + its resources → Internal analysis","clues":["quantity and quality","resources"],"trap":"داخل الشركة: موارد وقوة وضعف. خارجها: فرص وتهديدات.","topic":"strategy","term":"Internal analysis","canonical":{"file":"C","location":"س8"},"order":31},{"stem":"During the strategic implementation stage of the strategic management process, an organization","options":["Decides on a strategic direction","Defines its mission and goals","Establishes external opportunities and threats.","Ensures that it has skilled employees in place"],"type":"mcq","id":43,"answerIndex":3,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س13"]}],"answer":"Ensures that it has skilled employees in place","title":"تنفيذ الاستراتيجية وتجهيز العاملين","simple":"في Strategy implementation تتأكد المنظمة من وجود موظفين يملكون المهارات اللازمة.","detail":"الصياغة تختار الاتجاه وتحدد الرسالة والأهداف والفرص والتهديدات. التنفيذ يضع هذا الاختيار موضع العمل: أفراد ومهارات وهيكل وأنظمة ومكافآت تدعم المطلوب. لذلك ضمان وجود skilled employees يطابق التنفيذ، بينما بقية البدائل تتحدث عن خطوات اختيار الاتجاه وصياغته.","example":"بعد قرار التوسع في التجارة الإلكترونية، توظف الشركة مطورين وتدرّب خدمة العملاء وتجهز الأنظمة؛ إنها تنفذ الاستراتيجية.","link":"implementation → skilled employees in place","clues":["strategic implementation"],"trap":"حدد هل الشركة ما زالت تقرر اتجاهها أم بدأت تجهيز موارد تطبيقه.","topic":"strategy","term":"Strategy implementation","canonical":{"file":"C","location":"س13"},"order":32},{"type":"short","stem":"A story of how a firm creates value is:","options":[],"id":48,"answerIndex":null,"groups":["main"],"frequency":1,"rawOccurrences":2,"sources":[{"file":"D","locations":["س49 · القسم الثالث"]},{"file":"E","locations":["س49 · القسم الثالث"]}],"title":"نموذج الأعمال وخلق القيمة","simple":"القصة التي تشرح كيف تخلق الشركة قيمة هي Business model.","detail":"نموذج الأعمال يصف من تخدم الشركة، وما القيمة التي تقدمها، وكيف تنظّم الموارد والأنشطة لتقديمها والاستفادة منها. يختلف عن مجرد اختيار هدف استراتيجي أو كتابة وصف وظيفة. ورد السؤال في المصدر كعبارة قصيرة مع الإجابة دون خيارات، ولذلك أبقيناه تدريب إجابة قصيرة.","example":"منصة تجمع مطاعم وعملاء وسائقين وتكسب عمولة على الطلب تشرح قصة خلق القيمة وطريقة تحقيق العائد؛ هذا نموذج أعمالها.","link":"story + creates value → Business model","clues":["story","creates value"],"trap":"لا توجد خيارات أصلية لهذا السؤال؛ اكتب المصطلح نفسه بدل اختراع اختيارات غير واردة.","answer":"Business model","topic":"strategy","term":"Business model","canonical":{"file":"D","location":"س49 في القسم الثالث"},"order":33},{"stem":"Which of the following is an example of an experience-based situational interview?","options":["Ahmed was asked how he would resolve a certain technical fault in his workplace.","Sara was asked about her reaction if her co-workers indulged in racist behavior.","Ismail was asked to describe an event where his creativity led to effective problem solving.","Jana was asked what steps she would take in case of a power failure in the plant."],"type":"mcq","id":6,"answerIndex":2,"groups":["main"],"frequency":1,"rawOccurrences":9,"sources":[{"file":"A","locations":["س6","س40"]},{"file":"B","locations":["س2"]},{"file":"D","locations":["بداية الملف: 3 (غير مرقّم)","س18 · القسم الثاني","س40 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 3 (غير مرقّم)","س18 · القسم الثاني","س40 · القسم الثالث"]}],"answer":"Ismail was asked to describe an event where his creativity led to effective problem solving.","title":"المقابلة المبنية على خبرة سابقة","simple":"السؤال عن حدث حصل فعلًا في الماضي هو Experience-based interview.","detail":"المقابلة الموقفية قد تطلب موقفًا سابقًا حقيقيًا أو ردًا على موقف افتراضي مستقبلي. عبارة describe an event where his creativity led to تعني أن إسماعيل يصف ما فعله فعلًا. أما how he would resolve أو what steps she would take فتسأل عن سلوك مفترض لم يحدث بعد. لذلك مثال إسماعيل هو المثال المبني على الخبرة.","example":"Tell me about a time you solved a customer problem = خبرة سابقة. What would you do if a customer complained? = موقف افتراضي مستقبلي.","link":"describe an event + led to → Past experience","clues":["experience-based"],"trap":"الاسم أو نوع المشكلة غير مهم؛ الزمن الفعلي للفعل هو الرابط الأقوى.","topic":"selection","term":"Experience-based interview","canonical":{"file":"A","location":"س6"},"order":34},{"stem":"Which of the following is true about O*NET?","options":["It is a private job-listing index.","It uses a common language that generalizes job specifications across various occupations.","It relies exclusively on fixed job titles.","It relies exclusively on narrow task descriptions."],"type":"mcq","id":10,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":4,"sources":[{"file":"A","locations":["س10"]},{"file":"B","locations":["س10"]},{"file":"D","locations":["س10 · القسم الثاني"]},{"file":"E","locations":["س10 · القسم الثاني"]}],"answer":"It uses a common language that generalizes job specifications across various occupations.","title":"قاعدة المهن O*NET","simple":"O*NET يصف المهن ومتطلباتها بلغة موحدة مشتركة.","detail":"يساعد O*NET على مقارنة متطلبات المهن مثل المهارات والمعارف والقدرات والأنشطة. الفكرة المهمة في السؤال هي اللغة المشتركة التي تنظّم مواصفات المهن، وليس أنه قائمة خاصة للوظائف الشاغرة أو أنه يعتمد فقط على مسميات ضيقة وثابتة. كلمة exclusively تجعل البدائل أضيق من وظيفة القاعدة الفعلية.","example":"بدل أن تسمي كل شركة مهارة خدمة العملاء باسم مختلف، تسمح اللغة المشتركة بوصف المهارة بطريقة قابلة للمقارنة بين المهن.","link":"O*NET + common language → unified job information","clues":["O*NET"],"trap":"O*NET ليس مجرد موقع إعلانات توظيف؛ الخيارات التي تقول exclusively تستبعد جوانب أساسية منه.","topic":"selection","term":"O*NET","canonical":{"file":"A","location":"س10"},"order":35},{"stem":"Ability that refers to the speed and accuracy with which one can solve arithmetic problems is:","options":["Reasoning","Technical","Quantitative","Comprehension"],"type":"mcq","id":20,"answerIndex":2,"groups":["main"],"frequency":1,"rawOccurrences":7,"sources":[{"file":"A","locations":["س20","س32"]},{"file":"B","locations":["س5"]},{"file":"D","locations":["س9 · القسم الثاني","س50 · القسم الثالث"]},{"file":"E","locations":["س9 · القسم الثاني","س50 · القسم الثالث"]}],"answer":"Quantitative","title":"القدرة الكمية والحساب","simple":"حل المسائل الحسابية بسرعة ودقة هو Quantitative ability.","detail":"القدرة الكمية تتعلق بمعالجة الأرقام والحساب. Reasoning أوسع ويرتبط بالاستدلال والعلاقات المنطقية، وComprehension بفهم المعلومات. السؤال يحدد arithmetic problems، لذلك لا نحتاج تخمينًا اعتمادًا على السرعة وحدها؛ طبيعة المهمة الحسابية هي الدليل الحاسم.","example":"شخص يحسب الخصومات والإجماليات بسرعة وبأخطاء قليلة يُظهر قدرة كمية.","link":"speed and accuracy + arithmetic → Quantitative ability","clues":["speed and accuracy","arithmetic problems"],"trap":"السرعة وحدها ليست تعريف القدرة الكمية؛ وجود المسائل الحسابية يحددها.","topic":"selection","term":"Quantitative ability","canonical":{"file":"A","location":"س20"},"order":36},{"stem":"Saad has been sent to work in New Hampshire from Saudi Arabia. He is not a permanent citizen. He is a:","options":["Host country national","Repatriate","Expatriate","Inpatriate"],"type":"mcq","id":21,"answerIndex":2,"groups":["main"],"frequency":1,"rawOccurrences":11,"sources":[{"file":"A","locations":["س21","س39"]},{"file":"B","locations":["س13"]},{"file":"D","locations":["بداية الملف: 2 (غير مرقّم)","س7 · القسم الأول","س7 · القسم الثاني","س39 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 2 (غير مرقّم)","س7 · القسم الأول","س7 · القسم الثاني","س39 · القسم الثالث"]}],"answer":"Expatriate","title":"الموظف الموفد خارج بلده","simple":"سعد موفد للعمل خارج بلده؛ التصنيف المناسب في السؤال هو Expatriate.","detail":"Expatriate موظف يعمل في بلد غير بلده ضمن تكليف دولي. Repatriate يعود إلى بلده بعد مهمة خارجية. Inpatriate يستخدم بصورة أدق لانتقال موظف من فرع خارجي إلى المقر الرئيسي. نص السؤال لا يذكر انتقالًا من فرع إلى المقر؛ ولا يكفي مجرد العمل في بلد الاستضافة لتصنيفه مواطنًا محليًا، كما أن النص لا يقدم تفاصيل الانتقال إلى المقر اللازمة لاختيار Inpatriate.","example":"موظف سعودي يعمل في فرع شركته بأمريكا خلال مهمة دولية هو expatriate. إذا عاد للعمل في السعودية بعد المهمة، تصبح عودته repatriation.","link":"sent to work abroad + not a permanent citizen → Expatriate","clues":["Saad","Saudi Arabia","New Hampshire"],"trap":"بعض النسخ تؤشر Inpatriate؛ لا يوجد في نص السؤال شرط الفرع → المقر الرئيسي الذي يدعم هذا الاختيار.","correction":{"title":"تعارض بين إجابات التجميعات","text":"اعتمدنا Expatriate. بعض النسخ تختار Inpatriate، لكن انتقال الموظف إلى المقر الرئيسي من فرع خارجي غير مذكور في السؤال.","url":"https://blog.iese.edu/expatriatus/2014/01/22/inpatriates-on-the-term-and-academic-findings/","label":"تعريف أكاديمي — IESE / Sebastian Reiche"},"topic":"selection","term":"Expatriate","canonical":{"file":"A","location":"س21"},"order":37},{"type":"essay","stem":"Explain situational interviews. What are the two varieties of situational judgment items?","options":[],"id":30,"answerIndex":null,"groups":["main"],"frequency":1,"rawOccurrences":3,"sources":[{"file":"A","locations":["س57"]},{"file":"D","locations":["مقالي 2 · القسم الأول"]},{"file":"E","locations":["مقالي 2 · القسم الأول"]}],"title":"مقالي نوعا المقابلات الموقفية","simple":"النوعان المرتبطان بهذا السؤال: Experience-based وFuture-oriented.","detail":"المقابلة الموقفية تقدم موقف عمل لتقييم طريقة التفكير والتصرف. Experience-based تطلب وصف ما فعله المرشح في موقف حقيقي سابق. Future-oriented تطلب كيف سيتصرف في موقف افتراضي قد يحدث مستقبلًا. المعرفة والسلوك مفهومان مهمان في اختبارات الحكم الموقفي، أما تقسيم Knowledge / Behavioral tendency فيتعلق بتعليمات الإجابة في اختبارات SJT، ويختلف عن نوعي المقابلات اللذين يفسران مثال الخبرة السابقة.","example":"ماضٍ: Describe a time you solved a conflict. مستقبل افتراضي: What would you do if two team members disagreed? اذكر تعريف النوعين ثم مثالًا لكل واحد.","link":"Describe a past event ↔ Experience-based; What would you do ↔ Future-oriented","clues":["situational interviews","two varieties"],"trap":"ميّز بين نوع المقابلة، وبين تعليمات إجابة اختبار SJT: ما ينبغي فعله مقابل ما ستفعله.","answer":"Situational interviews assess how applicants deal with job-related situations. Experience-based items ask applicants to describe what they actually did in a past situation. Future-oriented items ask what they would do in a hypothetical future situation. For example: describe a past conflict you resolved, or explain what you would do if a customer complained.","answerPoints":["Definition of situational interview","Experience-based: a real past event","Future-oriented: a hypothetical situation","One example for each"],"correction":{"title":"تصحيح نوعي المقابلات","text":"اعتمدنا Experience-based وFuture-oriented. هذا التقسيم يفسر مثال إسماعيل في سؤال الاختياري؛ Knowledge / Behavioral tendency تقسيم معترف به لتعليمات الإجابة في SJT، لكنه مختلف عن تقسيم المقابلات الذي نعتمده في سياق هذا السؤال.","url":"https://open.lib.umn.edu/internationalbusiness/chapter/12-3-effective-selection-and-placement-strategies/","label":"University of Minnesota — Selection and placement"},"topic":"selection","term":"Situational interviews","canonical":{"file":"D","location":"المقالي 2 في القسم الأول"},"order":38},{"stem":"A _________ is defined dialogue initiated by one or more persons to gather information and evaluate the qualifications of an applicant for employment.","options":["selection interview","focused group interview","physical ability test","cognitive ability test"],"type":"mcq","id":31,"answerIndex":0,"groups":["main"],"frequency":1,"rawOccurrences":3,"sources":[{"file":"B","locations":["س11"]},{"file":"D","locations":["س48 · القسم الثالث"]},{"file":"E","locations":["س48 · القسم الثالث"]}],"answer":"selection interview","title":"تعريف مقابلة الاختيار","simple":"حوار لجمع المعلومات وتقييم مؤهلات المتقدم للعمل هو Selection interview.","detail":"المقابلة جزء من عملية الاختيار. قد تكون منظمة بأسئلة موحدة أو تتضمن مواقف وأسئلة خبرة. الكلمة الحاسمة هنا هي applicant for employment: المراد تقييم مرشح لوظيفة. اختبار القدرات البدنية أو المعرفية يقيس قدرة محددة، بينما الحوار بين أشخاص هو المقابلة.","example":"يسأل مسؤول التوظيف مرشحًا عن خبرته وكيف تعامل مع مشكلة في وظيفته السابقة، ثم يقيم ملاءمته للدور.","link":"dialogue + applicant for employment → Selection interview","clues":["dialogue","applicant for employment"],"trap":"ليس كل interview بحثًا جماعيًا؛ غرض التوظيف يحدد Selection interview.","topic":"selection","term":"Selection interview","canonical":{"file":"B","location":"س11"},"order":39},{"stem":"Which of the following is true about outsourcing?","options":["It became valid after production methods became obsolete.","It is logical when a firm lacks expertise and is not willing to develop it.","Technology has slowed outsourcing.","Statistical forecasting caused outsourcing overseas."],"type":"mcq","id":17,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":4,"sources":[{"file":"A","locations":["س17","س28"]},{"file":"D","locations":["س19 · القسم الثاني"]},{"file":"E","locations":["س19 · القسم الثاني"]}],"answer":"It is logical when a firm lacks expertise and is not willing to develop it.","title":"متى نستخدم التعهيد؟","simple":"إذا كانت الشركة تفتقر لخبرة معينة ولا تريد بناءها داخليًا، يكون Outsourcing خيارًا منطقيًا.","detail":"التعهيد هو إسناد نشاط إلى جهة خارجية. قرار الشراء من الخارج يقارن بين بناء القدرة داخل الشركة والاستفادة من متخصص. قد يكون منطقيًا لنشاط لا يمثل جوهر تميز الشركة أو حين لا تريد الاستثمار في الخبرة المطلوبة. السؤال لا يقول إن التقنية أبطأت التعهيد أو إن طريقة إحصائية هي السبب الوحيد لانتقال الأعمال للخارج.","example":"متجر صغير يحتاج أمنًا سيبرانيًا متقدمًا لكنه لا يريد إنشاء إدارة كاملة؛ يتعاقد مع شركة متخصصة.","link":"lacks expertise + not willing to develop it → Outsourcing","clues":["outsourcing"],"trap":"Outsourcing ليس مرادفًا للسفر أو التوظيف من الخارج؛ الأساس جهة خارجية تؤدي نشاطًا.","topic":"planning","term":"Outsourcing","canonical":{"file":"A","location":"س17"},"order":40},{"stem":"A(n) ________ shows the proportion of employees in different job categories at different times.","options":["Invertible matrix","Transitional matrix","Definite matrix","Task role matrix"],"type":"mcq","id":19,"answerIndex":1,"groups":["main"],"frequency":1,"rawOccurrences":8,"sources":[{"file":"A","locations":["س19","س31"]},{"file":"D","locations":["بداية الملف: 4 (غير مرقّم)","س15 · القسم الثاني","س41 · القسم الثالث"]},{"file":"E","locations":["بداية الملف: 4 (غير مرقّم)","س15 · القسم الثاني","س41 · القسم الثالث"]}],"answer":"Transitional matrix","title":"مصفوفة انتقال الموظفين","simple":"تتبّع نسب انتقال الموظفين بين الفئات الوظيفية عبر الزمن يعني Transitional matrix.","detail":"المصفوفة الانتقالية تساعد في توقع العرض الداخلي من العمالة. تبيّن مثلًا نسبة من سيبقون في فئتهم أو يترقون أو ينتقلون أو يغادرون خلال فترة. هي أكثر من عدد الموظفين اليوم؛ تربط فئاتهم الحالية بفئاتهم المستقبلية المتوقعة. لذلك كلمتا different categories وdifferent times مهمتان.","example":"من 100 مساعد، بقي 70 مساعدين، وترقى 20، وغادر 10. تسجيل هذه النسب ومقارنتها عبر الفترات يبني مصفوفة انتقال.","link":"proportion + job categories + different times → Transitional matrix","clues":["proportion","different times"],"trap":"الجدول الذي يصف المهام فقط لا يتتبع انتقال الموظفين بين الفئات.","topic":"planning","term":"Transitional matrix","canonical":{"file":"A","location":"س19"},"order":41},{"type":"essay","stem":"Discuss the major options organizations have for reducing labor surpluses.","options":[],"id":32,"answerIndex":null,"groups":["main"],"frequency":1,"rawOccurrences":5,"sources":[{"file":"B","locations":["س16"]},{"file":"D","locations":["مقالي فائض العمالة","مقالي فائض العمالة (مكرر)"]},{"file":"E","locations":["مقالي فائض العمالة","مقالي فائض العمالة (مكرر)"]}],"title":"مقالي تقليل فائض العمالة","simple":"الفائض يعني أن الموظفين المتوقعين أكثر من الحاجة؛ اختر بين حلول سريعة مؤلمة وأخرى أبطأ.","detail":"من الخيارات Downsizing، خفض الأجور، تخفيض الدرجة الوظيفية، النقل، مشاركة العمل، التقاعد المبكر، التناقص الطبيعي Attrition، تجميد التوظيف وإعادة التدريب. تختلف هذه البدائل في السرعة والأثر على الموظفين. التناقص الطبيعي يخفض العدد بعدم تعويض المغادرين، بينما إعادة التدريب والنقل يستفيدان من العاملين في أدوار مطلوبة. لا تجعل تسريح الجميع أول حل وحيد في إجابة المقالي.","example":"الشركة تحتاج 90 موظفًا ولديها 100. قد تجمّد التوظيف وتنتظر مغادرة طبيعية إذا سمح الوقت، أو تنقل وتعيد تدريب بعض الموظفين بدل تسريحهم.","link":"labor surplus → reduce excess supply; speed versus employee impact","clues":["labor surpluses"],"trap":"العمل الإضافي يعالج النقص عادةً، فلا تذكره بوصفه وسيلة أساسية لتقليل الفائض.","answer":"Options for reducing a labor surplus include downsizing, pay reductions, demotions, transfers, work sharing, early retirement, natural attrition, hiring freezes, and retraining. Organizations should compare the speed of each option with its effects on employees. Faster options may cause greater harm, while gradual attrition and retraining may take more time.","answerPoints":["Explain surplus: supply exceeds demand","List several relevant options","Compare speed and employee impact","Explain at least one example"],"topic":"planning","term":"Labor surplus","canonical":{"file":"B","location":"س16"},"order":42},{"stem":"_______is considered a slow option for avoiding an expected labor shortage but has high revocability.","options":["Natural attrition","Retrained transfer","Outsourcing","Transfer"],"type":"mcq","id":34,"answerIndex":1,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س3"]}],"answer":"Retrained transfer","title":"حل نقص العمالة البطيء والقابل للرجوع","simple":"إعادة التدريب مع النقل Retrained transfer خيار بطيء وعالي القابلية للرجوع.","detail":"نقص العمالة يعني أن الطلب على الموظفين يزيد على المعروض. لا يكفي أن تعرف اسم الحل؛ السؤال يجمع شرطين: السرعة منخفضة والقابلية للرجوع عالية. إعادة التدريب تحتاج وقتًا قبل أن ينتقل العامل إلى دوره الجديد، لكنها أكثر مرونة من التزام طويل بتعيينات دائمة. التعهيد غالبًا أسرع، والتناقص الطبيعي يخفض العدد ولا يحل نقصًا متوقعًا.","example":"قسم لديه موظفون متاحون وقسم آخر يحتاج فنيين. تُدرّب الشركة بعض العاملين ثم تنقلهم داخليًا؛ التجهيز بطيء نسبيًا مع مرونة في إعادة التوزيع.","link":"slow + high revocability + shortage → Retrained transfer","clues":["slow option","labor shortage","high revocability"],"trap":"لا تختَر Outsourcing لمجرد المرونة؛ شرط slow يستبعده في جدول المقرر.","topic":"planning","term":"Retrained transfer","canonical":{"file":"C","location":"س3"},"order":43},{"stem":"When a company participates in lean thinking, they evaluate current practices to:","options":["Do minimal work with highest attention to detail.","Deliver best service while compromising volume.","Create quality products using maximum resources.","Do more with less effort, time, space, and equipment."],"type":"mcq","id":15,"answerIndex":3,"groups":["main"],"frequency":1,"rawOccurrences":4,"sources":[{"file":"A","locations":["س15","س53"]},{"file":"D","locations":["س12 · القسم الثاني"]},{"file":"E","locations":["س12 · القسم الثاني"]}],"answer":"Do more with less effort, time, space, and equipment.","title":"التفكير الرشيق Lean thinking","simple":"الهدف خلق قيمة أكثر بجهد ووقت ومساحة ومعدات أقل.","detail":"التفكير الرشيق يراجع الممارسات لإزالة الهدر مع الحفاظ على القيمة التي يحتاجها العميل. الهدر قد يكون انتظارًا أو تنقلًا زائدًا أو مخزونًا غير لازم أو إعادة عمل بسبب أخطاء. ليس الهدف أداء أقل عمل بأي جودة، ولا استخدام أكبر كمية من الموارد لصنع منتج جيد. العلاقة الأساسية هي قيمة أكبر مقابل موارد أقل.","example":"مطعم يقلل تنقل الطاهي بين الثلاجة والموقد بإعادة ترتيب المكان؛ ينجز الطلبات أسرع دون خفض الجودة.","link":"lean thinking → more value with less resources","clues":["lean thinking"],"trap":"الأقل في الموارد لا يعني التضحية بالجودة أو بخدمة العميل.","topic":"foundations","term":"Lean thinking","canonical":{"file":"A","location":"س15"},"order":44},{"type":"essay","stem":"What are the six important functional areas of human resource management? Explain any one in detail.","options":[],"id":29,"answerIndex":null,"groups":["main"],"frequency":1,"rawOccurrences":5,"sources":[{"file":"A","locations":["س55","س56"]},{"file":"B","locations":["س17"]},{"file":"D","locations":["مقالي 1 · القسم الأول"]},{"file":"E","locations":["مقالي 1 · القسم الأول"]}],"title":"مقالي المجالات الوظيفية الستة","simple":"احفظ ستة مجالات: تحليل وتصميم، استقطاب واختيار، تدريب وتطوير، أداء، أجور وحوافز ومزايا، علاقات عمل.","detail":"الإجابة النموذجية المقترحة تجمع ممارسات HRM في ست مجموعات؛ تبدأ المجالات بتحليل الوظائف وتصميمها، ثم الاستقطاب والاختيار، والتدريب والتطوير، وإدارة الأداء، وهيكل الأجور والحوافز والمزايا، وعلاقات العمل والموظفين. يكفي بعد سرد الستة أن تشرح مجالًا واحدًا بوضوح مع مثال. الإجابات المرفقة تختلف في طريقة التجميع؛ لا يوجد بينها مفتاح مقرر موحد يحسم القائمة، فطابق قائمة محاضرتك إذا كانت محددة.","example":"Recruitment يجذب المتقدمين المناسبين، ثم Selection يختار الأنسب باستخدام مقابلات واختبارات وتحقيق بيانات. إعلان الوظيفة استقطاب؛ قرار من يُقبل اختيار.","link":"six functional areas → Analyze, Recruit, Train, Perform, Pay, Relate","clues":["six important functional areas"],"trap":"التجميعات تعرض قوائم مختلفة؛ النموذج هنا يتبع المجالات الستة في شرائح Noe، مع توضيح المصدر.","answer":"One consistent six-area grouping of HRM practices is job analysis and design; recruitment and selection; training and development; performance management; pay structure, incentives, and benefits; and labor and employee relations. Recruitment attracts qualified applicants, while selection identifies the most suitable candidate through relevant interviews, tests, and checks.","answerPoints":["Job analysis and design","Recruitment and selection","Training and development","Performance management","Pay structure, incentives, and benefits","Labor and employee relations"],"correction":{"title":"إجابة مقترحة؛ القوائم تختلف في المصادر","text":"لا تعطي التجميعات قائمة موحدة. جمعنا ممارسات HRM الواردة في شرائح Noe في ست مجموعات للمراجعة. الشريحة لا تنص حرفيًا على أنها قائمة رسمية من ستة مجالات؛ اتبع قائمة محاضرتك إن كانت محددة.","url":"https://www.csun.edu/~swalkerl/M460/2008.4/PPT/Chap002.pdf","label":"Noe — HRM Practices، شريحة 2-11 (أساس التجميع المقترح)"},"topic":"foundations","term":"Six functional areas","canonical":{"file":"A","location":"س55"},"order":45},{"type":"essay","stem":"What are the four dimensions of human resource management practices?","options":[],"id":33,"answerIndex":null,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س2"]}],"title":"مقالي الأبعاد الأربعة لممارسات HRM","simple":"الأبعاد: إدارة البيئة، اكتساب وتجهيز الأفراد، تقييمهم وتطويرهم، وتعويضهم.","detail":"الأبعاد الأربعة تجمع ممارسات الموارد البشرية في مجموعات أوسع من المجالات الوظيفية الستة. الأول يراعي البيئة الداخلية والخارجية. الثاني يحدد نوع وعدد العاملين ويستقطبهم ويجهزهم. الثالث يقيّم الأداء وينمي المهارات اللازمة للعمل الحالي والمستقبلي. الرابع يستخدم الأجور والمزايا لجذب العاملين وتحفيزهم ومكافأتهم. عدد المجموعات المطلوبة في نص السؤال مهم: أربعة أبعاد، لا ستة مجالات.","example":"شركة توسعت في فرع جديد: درست سوق العمل، وظفت ودربت الفريق، راجعت الأداء وطورت المهارات، ثم حددت الرواتب والحوافز؛ هذه الأبعاد الأربعة.","link":"four dimensions → Environment, Acquire, Assess, Compensate","clues":["four dimensions"],"trap":"لا تجب بقائمة six functional areas؛ السؤالان متقاربان في الموضوع لكنهما مختلفان في المطلوب.","answer":"The four dimensions are managing the human resource environment; acquiring and preparing human resources; assessing and developing human resources; and compensating human resources. Together, they address the setting for work, obtaining and preparing employees, improving current and future performance, and rewarding employee contributions.","answerPoints":["Managing the HR environment","Acquiring and preparing HR","Assessing and developing HR","Compensating HR"],"topic":"foundations","term":"Four dimensions of HRM","canonical":{"file":"C","location":"س2"},"order":46},{"stem":"Traditionally, the HRM department was primarily a (n)","options":["Proactive agency","Finance expert","Employer advocate","Administrative expert"],"type":"mcq","id":44,"answerIndex":3,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س14"]}],"answer":"Administrative expert","title":"الدور التقليدي للموارد البشرية","simple":"الدور التقليدي الأساسي كان Administrative expert.","detail":"تركّز الدور التقليدي على المعاملات والإجراءات والسجلات والالتزام والرواتب. تطور عمل الموارد البشرية ليشمل شراكة أوسع في الاستراتيجية وتطوير المنظمة، لكن كلمة Traditionally تعيدك إلى الدور الإداري. السؤال لا يقول إن كل عمل HR اليوم محصور في الأوراق؛ إنه يسأل عن المنظور التقليدي.","example":"إدارة تحفظ ملفات التوظيف وتسجل الإجازات وتعالج المعاملات تمثل الدور الإداري التقليدي.","link":"Traditionally + HRM department → Administrative expert","clues":["Traditionally"],"trap":"لا تخلط تاريخ الدور مع الدور الاستراتيجي المعاصر الذي يناقشه المقرر.","topic":"foundations","term":"Administrative expert","canonical":{"file":"C","location":"س14"},"order":47},{"stem":"Which competency is an HR professional said to have if he is able to act personally and professionally with integrity and accountability?","options":["Critical evaluation","Consultation","Business acumen","Ethical practice"],"type":"mcq","id":45,"answerIndex":3,"groups":["blue"],"frequency":1,"rawOccurrences":1,"sources":[{"file":"C","locations":["س15"]}],"answer":"Ethical practice","title":"النزاهة والمساءلة ككفاءة مهنية","simple":"التصرف بنزاهة ومساءلة يشير إلى Ethical practice.","detail":"الممارسة الأخلاقية تتعلق باتخاذ القرار والتصرف بمسؤولية ونزاهة في العمل. Business acumen فهم الأعمال، وCritical evaluation تحليل الأدلة، وConsultation تقديم المشورة. قد يحتاج مسؤول HR كل هذه الكفاءات، لكن كلمات integrity وaccountability تحدد الجانب الأخلاقي تحديدًا.","example":"مسؤول توظيف يرفض تفضيل قريب له دون استحقاق ويحافظ على سرية بيانات المتقدمين؛ هذه ممارسة أخلاقية.","link":"integrity + accountability → Ethical practice","clues":["integrity","accountability"],"trap":"حل السؤال يعتمد على الدليل المميز في النص، لا على أي كفاءة تبدو مفيدة عمومًا.","topic":"foundations","term":"Ethical practice","canonical":{"file":"C","location":"س15"},"order":48}],"topics":[{"id":"training","title":"التدريب والتعلّم","en":"Training & learning","icon":"book","ids":[23,4,16,18,26,35,39,40,46],"lead":"ابدأ بمعرفة الاحتياج، ثم جهّز التعلم، وتأكد أن المهارة تنتقل إلى العمل.","contrast":"منظمة = لماذا ندرّب؟ فرد = من يحتاج؟ مهمة = ماذا يتعلم؟","count":9,"shared":1,"rank":0},{"id":"performance","title":"الأداء والقياس","en":"Performance & measurement","icon":"chart","ids":[37,11,12,13,14,27,28,36,41],"lead":"افصل بين تحسين الأداء، وطريقة تقييمه، وجودة المقياس الذي تستخدمه.","contrast":"Reliability = اتساق. Validity = قياس المطلوب. Strategic congruence = توافق الاستراتيجية.","count":9,"shared":1,"rank":1},{"id":"work","title":"الوظيفة وتدفّق العمل","en":"Job analysis & work design","icon":"layers","ids":[1,3,5,7,8,22,42,47],"lead":"اعرف الفرق بين دراسة الوظيفة وتصميمها، وبين وصف العمل ومواصفات من يؤديه.","contrast":"Description = المهام. Specification = الشخص. Analysis = جمع المعلومات. Design = ترتيب العمل.","count":8,"shared":0,"rank":2},{"id":"strategy","title":"الاستراتيجية وخلق القيمة","en":"Strategy & value","icon":"compass","ids":[2,24,25,38,43,48],"lead":"الصياغة تختار الاتجاه، والتنفيذ يجهّز الناس والموارد لتطبيقه.","contrast":"Formulation = أين نذهب؟ Implementation = كيف نطبّق؟ Business model = كيف نخلق قيمة؟","count":6,"shared":0,"rank":3},{"id":"selection","title":"الاختيار والمقابلات","en":"Selection & interviews","icon":"users","ids":[6,10,20,21,30,31],"lead":"انتبه لغرض السؤال وزمن الموقف، ثم فرّق بين المقابلة واختبار القدرة والمهمة الدولية.","contrast":"Past event = Experience-based. Hypothetical future = Future-oriented.","count":6,"shared":0,"rank":4},{"id":"planning","title":"تخطيط العمالة","en":"HR planning","icon":"route","ids":[9,17,19,32,34],"lead":"قارن الطلب المتوقع بالعرض، ثم اختر علاجًا يناسب النقص أو الفائض.","contrast":"طلب أكبر من العرض = نقص. عرض أكبر من الطلب = فائض. أول خطوة = Forecasting.","count":5,"shared":1,"rank":5},{"id":"foundations","title":"أساسيات الموارد البشرية","en":"HR foundations","icon":"grid","ids":[15,29,33,44,45],"lead":"ثبّت القوائم الأساسية، والدور الإداري، والكفاءة الأخلاقية، ومعنى تقليل الهدر.","contrast":"أربعة أبعاد واسعة، وستة مجالات وظيفية؛ اقرأ العدد والمطلوب قبل أن تسرد الإجابة.","count":5,"shared":0,"rank":6}],"files":[{"id":"A","name":"mgt 211-mid2026.pdf","pages":15,"raw":57,"unique":30,"group":"main"},{"id":"B","name":"MID MGT211.pdf","pages":5,"raw":17,"unique":17,"group":"main"},{"id":"C","name":"MGT211 - MIDTERM - BLUE.pdf","pages":4,"raw":17,"unique":17,"group":"blue"},{"id":"D","name":"MGT211 MIDTERM 2026...pdf","pages":13,"raw":72,"unique":34,"group":"main"},{"id":"E","name":"MGT211_MIDTERM_2026.docx","raw":72,"unique":34,"group":"main"}],"stats":{"raw":235,"unique":48,"duplicates":187,"main":34,"blue":17,"shared":3,"mcq":41,"short":1,"essay":6},"version":1};
